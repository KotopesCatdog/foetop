<html lang="ru">
<head>

<style>
body { display: flex; margin: 0; font-family: Arial, sans-serif; }
.container { display: flex; position: relative; }
.grid { display: grid; grid-template-columns: repeat(72, 20px); grid-template-rows: repeat(72, 20px); background-color: #eee; position: relative; }
.cell {
width: 20px; height: 20px; background-color: #fff;
border-right: 0.25px solid #000; border-bottom: 0.25px solid #000;
box-sizing: border-box;
}
.thick-right { border-right: 2px solid #000; }
.thick-bottom { border-bottom: 2px solid #000; }
.thick-both { border-right: 2px solid #000; border-bottom: 2px solid #000; }
.input-container { margin-left: 20px; padding: 10px; background-color: #f9f9f9; border: 1px solid #ccc; width: 300px; }
textarea { width: 100%; height: 200px; margin-bottom: 10px; }
.button-container { display: flex; flex-direction: column; gap: 5px; }
.button-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
.button-row button { flex: 1; padding: 5px 10px; font-size: 14px; cursor: pointer; }

.figure {
position: absolute;
background-color: rgba(0,0,0,0.5);
box-sizing: border-box;
cursor: grab;
display: flex;
align-items: center;
justify-content: center;
font-size: 10px;
color: white;
text-align: center;
overflow: hidden;
padding: 2px;
box-shadow: inset 0 0 0 2px black;
user-select: none;
white-space: pre-wrap;
line-height: 1.2;
z-index: 10;
}
.figure.ratusha { color: black; }
.gray { background-color: #999; }
.yellow { background-color: #ff0; }
.blue { background-color: #00f; }
.red { background-color: #f00; }
.default-color { background-color: #41adfa; }
.light-green { background-color: #90ee90; }
.green { background-color: #008000; }
.tooltip { position: fixed; background-color: rgba(0,0,0,0.8); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; display: none; z-index: 20; }
.space-under-buttons { width: 100%; height: 1440px; background-color: #f0f0f0; border: 1px solid #ccc; position: relative; margin-top: 10px; }
.size-selector { display: flex; gap: 5px; align-items: center; }
.size-selector select { padding: 5px; font-size: 14px; }
#height-select, #width-select { width: 50px; }
#color-select { width: 80px; }
.boundary { background-color: rgba(0, 255, 0, 0.3); }
.boundary-button-draw { background-color: #90ee90; }
.boundary-button-clear { background-color: #ff6347; }
#color-select option { padding-left: 20px; position: relative; }
#color-select option::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; position: absolute; left: 5px; top: 50%; transform: translateY(-50%); }
#color-select option[value="gray"]::before { background-color: #999; }
#color-select option[value="yellow"]::before { background-color: #ff0; }
#color-select option[value="blue"]::before { background-color: #00f; }
#color-select option[value="red"]::before { background-color: #f00; }
#color-select option[value="green"]::before { background-color: #008000; }
#color-select option[value="light-green"]::before { background-color: #90ee90; }
#color-select option[value="default-color"]::before { background-color: #41adfa; }
.instruction-link { margin-bottom: 10px; }
.road-result { margin-top: 10px; font-size: 14px; color: #333; }


#figure-name-input { width: 100px; padding: 5px; font-size: 14px; }
.blinking { animation: blink 1s infinite; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.yellow-outline { outline: 2px solid #ff0; outline-offset: -2px; }

/* Стили для облачных модалок */
.firebase-modal {
    display: none;
    position: fixed;
    background-color: #f9f9f9;
    border: 1.5px solid #ccc;
    padding: 20px;
    z-index: 1000;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    width: 350px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
}
.firebase-modal input {
    width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; box-sizing: border-box;
}
.firebase-modal-buttons {
    display: flex; gap: 10px; justify-content: center; margin-top: 15px;
}
.firebase-modal-buttons button {
    padding: 10px 20px; font-size: 16px; cursor: pointer;
}
.firebase-modal-buttons button.primary {
    background-color: #007BFF; color: white;
}
.firebase-modal-buttons button.secondary {
    background-color: #6c757d; color: white;
}
.error-message {
    color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; margin: 10px 0; text-align: center;
}
</style>
</head>


<body>
<div class="container">
<div class="grid" id="grid"></div>
<div class="input-container">

</div>

</div>
</div>
<div class="road-result" id="road-result"></div>
<div class="space-under-buttons" id="space-under-buttons"></div>
</div>
</div>
<div id="tooltip" class="tooltip"></div>

<script>
// === Google Drive интеграция ===
const GOOGLE_CLIENT_ID = '983813195278-dlgsdjjhi0iptrrstofk240e5eddldm8.apps.googleusercontent.com'; // твой рабочий Client ID
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.file';

let tokenClient;
let accessToken = null;

// Инициализация
function initGoogleDrive() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    callback: (tokenResponse) => {
      accessToken = tokenResponse.access_token;
    },
  });
}

// Авторизация
function googleAuth() {
  if (accessToken) return Promise.resolve(accessToken);

  return new Promise((resolve, reject) => {
    tokenClient.callback = (resp) => {
      if (resp.error) reject(resp);
      accessToken = resp.access_token;
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({prompt: 'consent'});
  });
}

// Сбор данных для сохранения
function getSaveData() {
  const figures = [];
  document.querySelectorAll('.figure').forEach(fig => {
    figures.push({
      name: fig.dataset.name || "",
      width: Math.round(fig.offsetWidth / 20),
      height: Math.round(fig.offsetHeight / 20),
      left: Math.round(fig.offsetLeft / 20),
      top: Math.round(fig.offsetTop / 20),
      color: Array.from(fig.classList).find(c => ['gray','yellow','blue','red','green','light-green','default-color'].includes(c)) || 'default-color'
    });
  });
  return { figures, timestamp: Date.now(), type: "cityplan" };
}

// Сохранение в Google Drive
async function saveToGoogleDrive() {
  const defaultName = "Город " + new Date().toLocaleDateString('ru-RU');
  const name = prompt("Имя файла в Google Drive:", defaultName);
  if (!name) return;

  try {
    await googleAuth();

    const data = getSaveData();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});

    const metadata = {
      name: name.trim() + '.json',
      mimeType: 'application/json'
    };

    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
    form.append('file', blob);

    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: new Headers({'Authorization': 'Bearer ' + accessToken}),
      body: form
    });

    if (response.ok) {
      alert("Сохранено в ваш Google Drive!");
    } else {
      alert("Ошибка сохранения в Drive");
    }
  } catch (e) {
    alert("Ошибка авторизации Google");
    console.error(e);
  }
}

// Загрузка из Google Drive через Picker
function loadFromGoogleDrive() {
  googleAuth().then(() => {
    const view = new google.picker.View(google.picker.ViewId.DOCS);
    view.setMimeTypes('application/json');

    const picker = new google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(accessToken)
      .setCallback((data) => {
        if (data.action === google.picker.Action.PICKED) {
          const fileId = data.docs[0].id;
          fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
            headers: {'Authorization': 'Bearer ' + accessToken}
          })
          .then(res => res.json())
          .then(jsonData => {
            resetFigures(true); // true = загрузка, не создавать ратушу автоматически

            jsonData.figures.forEach(f => {
              const figure = document.createElement('div');
              figure.classList.add('figure', f.color);
              if (f.name.toLowerCase().includes('ратуша')) figure.classList.add('ratusha');
              figure.style.width = `${f.width * 20}px`;
              figure.style.height = `${f.height * 20}px`;
              figure.style.left = `${f.left * 20}px`;
              figure.style.top = `${f.top * 20}px`;
              figure.dataset.name = f.name;

              const text = document.createElement('div');
              text.textContent = f.name.substring(0, Math.floor(f.width * 20 / 8));
              figure.appendChild(text);

              figure.addEventListener('click', e => {
                tooltip.textContent = f.name;
                tooltip.style.display = 'block';
                tooltip.style.left = `${e.clientX + 10}px`;
                tooltip.style.top = `${e.clientY + 10}px`;
              });
              figure.addEventListener('mouseleave', () => tooltip.style.display = 'none');

              grid.appendChild(figure);
              addDragHandlers(figure);
            });

            alert("Загружено из Google Drive!");
          });
        }
      })
      .build();
    picker.setVisible(true);
  }).catch(() => alert("Ошибка авторизации"));
}

// Запуск инициализации Google
window.addEventListener('load', initGoogleDrive);

// === Здесь начинается твой оригинальный код (создание грида и функций) ===

const grid = document.getElementById('grid');
const spaceUnderButtons = document.getElementById('space-under-buttons');
const tooltip = document.getElementById('tooltip');
const roadResult = document.getElementById('road-result');
const totalCells = 72 * 72;
const gridWidth = 72 * 20; // 1440px
const gridHeight = 72 * 20; // 1440px
const areas = [
{ colStart: 1, colEnd: 16, rowStart: 1, rowEnd: 8, color: '#ccc' },

{ colStart: 1, colEnd: 8, rowStart: 9, rowEnd: 24, color: '#ccc' },

{ colStart: 61, colEnd: 72, rowStart: 1, rowEnd: 8, color: '#ccc' },

{ colStart: 69, colEnd: 72, rowStart: 9, rowEnd: 24, color: '#ccc' },

{ colStart: 69, colEnd: 72, rowStart: 37, rowEnd: 72, color: '#ccc' },

{ colStart: 65, colEnd: 72, rowStart: 59, rowEnd: 64, color: '#ccc' },

{ colStart: 57, colEnd: 72, rowStart: 65, rowEnd: 72, color: '#ccc' },

{ colStart: 65, colEnd: 68, rowStart: 57, rowEnd: 61, color: '#ccc' },

{ colStart: 1, colEnd: 8, rowStart: 65, rowEnd: 72, color: '#ccc' },
{ colStart: 9, colEnd: 16, rowStart: 68, rowEnd: 72, color: '#ccc' }
];
let boundaryState = 0; // 0 - неактивно, 1 - рисование, 2 - удаление
let isDrawing = false;
for (let i = 0; i < totalCells; i++) {
const cell = document.createElement('div');
cell.classList.add('cell');
const row = Math.floor(i / 72) + 1;
const col = (i % 72) + 1;
const isThickCol = col % 4 === 0 && col <= 68;
const isThickRow = row % 4 === 0 && row <= 68;
if (isThickCol && isThickRow) {
cell.classList.add('thick-both');
} else if (isThickCol) {
cell.classList.add('thick-right');
} else if (isThickRow) {
cell.classList.add('thick-bottom');
}
areas.forEach(area => {
if (col >= area.colStart && col <= area.colEnd && row >= area.rowStart && row <= area.rowEnd) {
if (!(col === 68 && row >= 9 && row <= 24) &&
!(row === 68 && col >= 9 && col <= 16)) {
cell.style.backgroundColor = area.color;
}
}
});
grid.appendChild(cell);
}
function checkOverlapsAndGray() {
const figures = document.querySelectorAll('.figure');
figures.forEach(figure => figure.classList.remove('blinking', 'yellow-outline')); // Reset blinking and yellow outline
const whiteFigures = Array.from(figures).filter(figure => {
const x = Math.round(figure.offsetLeft / 20);
const y = Math.round(figure.offsetTop / 20);
const width = Math.round(figure.offsetWidth / 20);
const height = Math.round(figure.offsetHeight / 20);
return !isInGrayArea(x * 20, y * 20, width, height);
});
for (let i = 0; i < whiteFigures.length; i++) {
for (let j = i + 1; j < whiteFigures.length; j++) {
const fig1 = whiteFigures[i];
const fig2 = whiteFigures[j];
const x1 = fig1.offsetLeft;
const y1 = fig1.offsetTop;
const w1 = fig1.offsetWidth;
const h1 = fig1.offsetHeight;
const x2 = fig2.offsetLeft;
const y2 = fig2.offsetTop;
const w2 = fig2.offsetWidth;
const h2 = fig2.offsetHeight;
if (!(x1 + w1 <= x2 || x2 + w2 <= x1 || y1 + h1 <= y2 || y2 + h2 <= y1)) {
fig1.classList.add('blinking');
fig2.classList.add('blinking');
}
}
}
figures.forEach(figure => {
const x = Math.round(figure.offsetLeft / 20);
const y = Math.round(figure.offsetTop / 20);
const width = Math.round(figure.offsetWidth / 20);
const height = Math.round(figure.offsetHeight / 20);
if (isInGrayArea(x * 20, y * 20, width, height)) {
figure.classList.add('yellow-outline');
}
});
}
function testOverlaps() {
checkOverlapsAndGray();
}
function placeFigures() {
document.querySelectorAll('.figure').forEach(figure => figure.remove());
const input = document.getElementById('data-input').value.trim();
const lines = input.split('\n').filter(line => line.trim() !== '');
lines.forEach(line => {
const data = line.split('\t');
const [width, height, x, y, name] = data.slice(0, 5);
const color = data[5] || 'default-color';
const figure = document.createElement('div');
figure.classList.add('figure');
if (name === 'Ратуша') {
figure.classList.add('ratusha');
}
figure.style.width = `${width * 20}px`;
figure.style.height = `${height * 20}px`;
figure.style.left = `${x * 20}px`;
figure.style.top = `${y * 20}px`;
figure.dataset.name = name;
const colorMap = {
'1': 'gray',
'2': 'yellow',
'3': 'blue',
'4': 'red',
'5': 'green',
'6': 'light-green',
'gray': 'gray',
'yellow': 'yellow',
'blue': 'blue',
'red': 'red',
'green': 'green',
'light-green': 'light-green',
'default-color': 'default-color'
};
figure.classList.add(colorMap[color] || 'default-color');
const text = document.createElement('div');
const maxChars = Math.floor((width * 20) / 8);
text.textContent = name.substring(0, maxChars);
figure.appendChild(text);
figure.addEventListener('click', (e) => {
tooltip.textContent = name;
tooltip.style.display = 'block';
tooltip.style.left = `${e.clientX + 10}px`;
tooltip.style.top = `${e.clientY + 10}px`;
});
figure.addEventListener('mouseleave', () => {
tooltip.style.display = 'none';
});
grid.appendChild(figure);
addDragHandlers(figure);
});
}
function placeDefaultRatusha() {
const figure = document.createElement('div');
figure.classList.add('figure', 'yellow', 'ratusha');
figure.style.width = `${6 * 20}px`;
figure.style.height = `${7 * 20}px`;
figure.style.left = `${8 * 20}px`;
figure.style.top = `${8 * 20}px`;
figure.dataset.name = 'Ратуша';
const text = document.createElement('div');
const maxChars = Math.floor((6 * 20) / 8);
text.textContent = 'Ратуша'.substring(0, maxChars);
figure.appendChild(text);
figure.addEventListener('click', (e) => {
tooltip.textContent = 'Ратуша';
tooltip.style.display = 'block';
tooltip.style.left = `${e.clientX + 10}px`;
tooltip.style.top = `${e.clientY + 10}px`;
});
figure.addEventListener('mouseleave', () => {
tooltip.style.display = 'none';
});
grid.appendChild(figure);
addDragHandlers(figure);
}

function saveToFile() {
const figures = document.querySelectorAll('.figure');
if (figures.length === 0) {
alert("На поле нет фигур для сохранения!");
return;
}
const dataLines = [];
figures.forEach(figure => {
const width = Math.round(figure.offsetWidth / 20);
const height = Math.round(figure.offsetHeight / 20);
const x = Math.round(figure.offsetLeft / 20);
const y = Math.round(figure.offsetTop / 20);
const name = figure.dataset.name || "";
let color = '';
if (figure.classList.contains('gray')) color = '1';
else if (figure.classList.contains('yellow')) color = '2';
else if (figure.classList.contains('blue')) color = '3';
else if (figure.classList.contains('red')) color = '4';
else if (figure.classList.contains('green')) color = '5';
else if (figure.classList.contains('light-green')) color = '6';
else if (figure.classList.contains('default-color')) color = '';
const line = `${width}\t${height}\t${x}\t${y}\t${name}` + (color ? `\t${color}` : '');
dataLines.push(line);
});
const data = dataLines.join('\n');
const blob = new Blob([data], { type: 'text/plain' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'cityplan.txt';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
function loadFile(input) {
const file = input.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
document.getElementById('data-input').value = e.target.result;
};
reader.readAsText(file);
input.value = '';
}
function toggleBoundaryMode() {
const boundaryButton = document.getElementById('boundaryButton');
boundaryState = (boundaryState + 1) % 3;
boundaryButton.classList.remove('boundary-button-draw', 'boundary-button-clear');
grid.removeEventListener('mousedown', startDrawing);
grid.removeEventListener('mousemove', drawBoundary);
grid.removeEventListener('mousemove', removeBoundary);
grid.removeEventListener('mouseup', stopDrawing);
if (boundaryState === 1) {
boundaryButton.classList.add('boundary-button-draw');
grid.addEventListener('mousedown', startDrawing);
grid.addEventListener('mousemove', drawBoundary);
grid.addEventListener('mouseup', stopDrawing);
} else if (boundaryState === 2) {
boundaryButton.classList.add('boundary-button-clear');
grid.addEventListener('mousedown', startDrawing);
grid.addEventListener('mousemove', removeBoundary);
grid.addEventListener('mouseup', stopDrawing);
}
}
function startDrawing(event) {
isDrawing = true;
if (boundaryState === 1) drawBoundary(event);
else if (boundaryState === 2) removeBoundary(event);
}
function drawBoundary(event) {
if (!isDrawing || boundaryState !== 1) return;
const rect = grid.getBoundingClientRect();
const x = Math.floor((event.clientX - rect.left) / 20) * 20;
const y = Math.floor((event.clientY - rect.top) / 20) * 20;
const cellIndex = Math.floor(y / 20) * 72 + Math.floor(x / 20);
if (cellIndex >= 0 && cellIndex < totalCells && !isInGrayArea(x, y, 1, 1)) {
grid.children[cellIndex].classList.add('boundary');
}
}
function removeBoundary(event) {
if (!isDrawing || boundaryState !== 2) return;
const rect = grid.getBoundingClientRect();
const x = Math.floor((event.clientX - rect.left) / 20) * 20;
const y = Math.floor((event.clientY - rect.top) / 20) * 20;
const cellIndex = Math.floor(y / 20) * 72 + Math.floor(x / 20);
if (cellIndex >= 0 && cellIndex < totalCells && !isInGrayArea(x, y, 1, 1)) {
grid.children[cellIndex].classList.remove('boundary');
}
}
function stopDrawing() {
isDrawing = false;
}
function isInGrayArea(x, y, width, height) {
const colStart = Math.floor(x / 20) + 1;
const rowStart = Math.floor(y / 20) + 1;
const colEnd = colStart + width - 1;
const rowEnd = rowStart + height - 1;
for (let row = rowStart; row <= rowEnd; row++) {
for (let col = colStart; col <= colEnd; col++) {
for (let area of areas) {
if (col >= area.colStart && col <= area.colEnd &&
row >= area.rowStart && row <= area.rowEnd &&
!(col === 68 && row >= 9 && row <= 24) &&
!(row === 68 && col >= 9 && col <= 16) &&
!(row >= 59 && row <= 60 && col >= 65 && col <= 68)) {
return true;
}
}
}
}
return false;
}
function isOutsideGrid(x, y, width, height) {
const xEnd = x + width * 20;
const yEnd = y + height * 20;
return x < 0 || y < 0 || xEnd > gridWidth || yEnd > gridHeight;
}
function createFigure() {
const height = parseInt(document.getElementById('height-select').value);
const width = parseInt(document.getElementById('width-select').value);
const color = document.getElementById('color-select').value;
const name = document.getElementById('figure-name-input').value.trim() || "";
const figure = document.createElement('div');
figure.classList.add('figure', color);
if (name === 'Ратуша') {
figure.classList.add('ratusha');
}
figure.style.width = `${width * 20}px`;
figure.style.height = `${height * 20}px`;
figure.style.left = '20px';
figure.style.top = '20px';
figure.dataset.name = name;
const text = document.createElement('div');
const maxChars = Math.floor((width * 20) / 8);
text.textContent = name.substring(0, maxChars);
figure.appendChild(text);
figure.addEventListener('click', (e) => {
tooltip.textContent = name;
tooltip.style.display = 'block';
tooltip.style.left = `${e.clientX + 10}px`;
tooltip.style.top = `${e.clientY + 10}px`;
});
figure.addEventListener('mouseleave', () => {
tooltip.style.display = 'none';
});
grid.appendChild(figure);
addDragHandlers(figure);
}
function removeRoads() {
const roads = document.querySelectorAll('.figure.gray');
roads.forEach(road => {
road.style.left = `${71 * 20}px`;
road.style.top = `${16 * 20}px`;
});
}
function addDragHandlers(figure) {
let isDragging = false;
let offsetX, offsetY;
figure.addEventListener('mousedown', e => {
isDragging = true;
offsetX = e.clientX - figure.offsetLeft;
offsetY = e.clientY - figure.offsetTop;
figure.style.cursor = 'grabbing';
e.preventDefault();
});
document.addEventListener('mousemove', e => {
if (isDragging) {
const newX = e.clientX - offsetX;
const newY = e.clientY - offsetY;
const maxX = grid.offsetWidth + spaceUnderButtons.offsetWidth - figure.offsetWidth;
const maxY = Math.max(grid.offsetHeight, spaceUnderButtons.offsetHeight) - figure.offsetHeight;
figure.style.left = `${Math.max(0, Math.min(newX, maxX))}px`;
figure.style.top = `${Math.max(0, Math.min(newY, maxY))}px`;
}
});
document.addEventListener('mouseup', () => {
if (isDragging) {
const snappedX = Math.round(figure.offsetLeft / 20) * 20;
const snappedY = Math.round(figure.offsetTop / 20) * 20;
figure.style.left = `${snappedX}px`;
figure.style.top = `${snappedY}px`;
}
isDragging = false;
figure.style.cursor = 'grab';
});
figure.addEventListener('selectstart', e => {
e.preventDefault();
});
}

function resetFigures(isLoad = false) {
    // Удаляем все фигуры
    document.querySelectorAll('.figure').forEach(figure => figure.remove());

    roadResult.textContent = '';

    // Создаём ратушу ТОЛЬКО если это не загрузка данных
    if (!isLoad) {
        placeDefaultRatusha();
    }
}

function resetInput() {
document.getElementById('data-input').value = '';
roadResult.textContent = '';
}
function calculateRoads() {
const figures = document.querySelectorAll('.figure');
let requiredRoads = 0;
let currentRoads = 0;
figures.forEach(figure => {
const width = Math.round(figure.offsetWidth / 20);
const height = Math.round(figure.offsetHeight / 20);
const x = Math.round(figure.offsetLeft / 20);
const y = Math.round(figure.offsetTop / 20);
const name = figure.dataset.name || "";
const isRoad = figure.classList.contains('gray');
const isTownHall = name.toLowerCase().includes('ратуша');
const isBlue = figure.classList.contains('blue');
const isGreen = figure.classList.contains('green');
if (isInGrayArea(x * 20, y * 20, width, height) || isOutsideGrid(x * 20, y * 20, width, height)) {
return;
}
if (isRoad) {
currentRoads += width * height;
} else if (!isTownHall && !isBlue && !isGreen) {
requiredRoads += Math.min(width, height) / 2;
}
});
let resultText = `Количество дорог: ${currentRoads} клеток, эффективность: `;
if (currentRoads === 0) {
resultText += 'не определена (нет дорог)';
} else {
const efficiency = (requiredRoads / currentRoads) * 100;
resultText += `${efficiency.toFixed(2)}%`;
}
roadResult.textContent = resultText;
}
</script>
</body>
</html>
