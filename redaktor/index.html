<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редакторы</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Позволяет странице расти выше экрана */
            width: 100%;
            background-color: black;
            /* overflow больше не hidden — прокрутка разрешена */
        }
        body {
            display: flex;
            align-items: flex-start; /* Начинаем с верха, чтобы не обрезалось сверху */
            justify-content: center;
            padding: 40px 20px; /* Отступы по краям для мобильных */
            box-sizing: border-box;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 500px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 4px solid #008080;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
        }
        .menu-btn {
            padding: 18px 40px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background-color: #008080;
            border: 4px solid black;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .menu-btn:hover {
            background-color: #00a0a0;
            box-shadow: 0 0 25px rgba(0, 255, 255, 1);
            transform: scale(1.05);
        }
        .title {
            text-align: center;
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
        }
        .under-construction {
            width: 100%;
            max-width: 400px;
            margin: 40px auto 0;
            display: block;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h class="title">Редакторы</h>
       
         <a href="/redaktor/cityplan.html" target="_blank " class="menu-btn">Редактор города</a>
         <a href="/redaktor/posplan.html" target="_blank" class="menu-btn">Редактор поселения</a>
         <a href="/redaktor/cityplanhelp.html" target="_blank" class="menu-btn">Справка</a>
       
         
          
        
              <a href="/" target="_self" class="menu-btn">🏠 Возврат в меню</a>
       
    </div>
</body>
</html>
