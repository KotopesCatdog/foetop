<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор медалей</title>
    <link rel="icon" href="https://foehelp.ru/favicon.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin: 30px 0 40px;
            font-size: 24px;
        }

        

        /* Основной блок калькулятора */
        .calc-block {
            background: #333;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 18px;
            text-align: left;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background: #444;
            color: #eee;
            border: 1px solid #555;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }

        button {
            flex: 1;
            padding: 14px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0055aa;
        }

        .reset-button {
            background: #dc3545;
        }

        .reset-button:hover {
            background: #c82333;
        }

        #result {
            background: #444;
            padding: 20px;
            border-radius: 6px;
            font-size: 28px;
            font-weight: bold;
            color: #0f0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 480px) {
            .back-button {
                padding: 8px 16px;
                font-size: 15px;
            }

            h1 {
                font-size: 20px;
            }

            label, select, input, button {
                font-size: 16px;
            }

            #result {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>


<style>
    .navigation-buttons {
        display: flex;
        gap: 15px;
        margin: 20px 0;
        flex-wrap: wrap;
        justify-content: center; /* или flex-start, в зависимости от нужного расположения */
    }
    .back-button {
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #008080;
        border: 4px solid black;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s;
    }
    .back-button:hover {
        background-color: #00a0a0;
        box-shadow: 0 0 25px rgba(0, 255, 255, 1);
        transform: scale(1.05);
    }
</style>

<div class="navigation-buttons">
    <a href="javascript:history.back()" class="back-button">← Назад</a>
    <a href="/" class="back-button">🏠 Домой</a>
</div>

    <div class="content">
        <h1>Стоимость ходов в экпедиции</h1>

        <div class="calc-block">
            <label for="selectA">Стоимость первой покупки:</label>
            <select id="selectA" onchange="selectInputA()">
                <option value="">Выберите эпоху</option>
                <option value="1">Железный Век</option>
                <option value="2">Раннее Средневековье</option>
                <option value="3">Высокое Средневековье</option>
                <option value="6">Позднее Средневековье</option>
                <option value="10">Колониальная Эпоха</option>
                <option value="17">Индустриальная Эпоха</option>
                <option value="25">Эпоха Прогресса</option>
                <option value="37">Эпоха Модерна</option>
                <option value="50">Эпоха Постмодерна</option>
                <option value="67">Новейшее Время</option>
                <option value="92">Завтра</option>
                <option value="120">Будущее</option>
                <option value="150">Арктическое Будущее</option>
                <option value="150">Океаническое Будущее</option>
                <option value="180">Виртуальное Будущее</option>
                <option value="210">Космическая эра Марса</option>
                <option value="300">Пояс астероидов из космической эры</option>
                <option value="390">Космическая эра Венеры</option>
                <option value="480">Спутника Юпитера из космической эры</option>
                <option value="570">Титан</option>
                <option value="660">Космический хаб</option>
            </select>

            <label for="inputA">... или текущая стоимость покупки:</label>
            <input type="number" id="inputA" min="0" step="any" placeholder="Введите число">

            <label for="inputFrom">Текущая точка:</label>
            <input type="number" id="inputFrom" min="0" placeholder="Введите число">

            <div class="buttons">
                <button onclick="calculate('64')">До 64 точки</button>
                <button onclick="calculate('80')">До 80 точки</button>
            </div>

            <div id="result">Результат</div>

            <button class="reset-button" onclick="resetFields()">Сброс</button>
        </div>
    </div>

    <script>
        var resetSound = new Audio('https://static.wixstatic.com/mp3/27a41d_9be7c187c11e4ecda403b01e5f83a7e1.mp3');
        var resultSound = new Audio('https://static.wixstatic.com/mp3/27a41d_04eddddd2a84468e90c7e52f5abd1b19.mp3');

        function calculate(buttonValue) {
            var inputA = parseFloat(document.getElementById('inputA').value);
            var inputFrom = parseInt(document.getElementById('inputFrom').value);
            var resultDiv = document.getElementById('result');

            if (isNaN(inputA) || isNaN(inputFrom)) {
                resultDiv.innerText = 'Введите данные';
                return;
            }

            var inputE = 1;

            if (buttonValue === '64') {
                inputE = (64 - inputFrom);
            } else if (buttonValue === '80') {
                inputE = (80 - inputFrom);
            }

            if (inputE < 0) {
                resultDiv.innerText = 'Текущая точка должна быть меньше или равна целевой.';
                return;
            }

            var result = Math.round(inputA * (Math.pow(1.2, inputE) - 1) / 0.2);
            resultDiv.innerText = result.toLocaleString('ru-RU');

            resultSound.play();
        }

        function selectInputA() {
            var select = document.getElementById('selectA');
            var inputA = select.value;
            if (inputA !== "") {
                document.getElementById('inputA').value = inputA;
            }
        }

        function resetFields() {
            document.getElementById('inputA').value = '';
            document.getElementById('inputFrom').value = '';
            document.getElementById('result').innerText = 'Результат';
            document.getElementById('selectA').selectedIndex = 0;
            resetSound.play();
        }
    </script>

</body>
</html>
