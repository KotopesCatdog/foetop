        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .button-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
		
		
		.button-select-all {
    background-color: #28a745 !important;
}

.button-select-all:hover {
    background-color: #218838 !important;
}
		
        .button {
            width: 200px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .list-container {
            margin-top: 20px;
            display: none; /* Скрываем список по умолчанию */
            border: 1px solid #A3D9F6;
            padding: 10px;
            background-color: #A3D9F6;
        }
        .checkbox {
            margin-right: 10px;
        }
        #databaseOutput {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #A3D9F6;
            background-color: #A3D9F6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #007BFF;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #A3D9F6;
        }
    </style>
</head>

function selectAll() {
    const checkboxes = document.querySelectorAll('.checkbox');
    const allChecked = Array.from(checkboxes).every(checkbox => checkbox.checked);
    checkboxes.forEach(checkbox => {
        checkbox.checked = !allChecked; // Если все отмечены, снимаем; иначе отмечаем
    });
    checkDatabase(); // Обновляем таблицу
}

function toggleList(containerId) {
    const listContainer = document.getElementById(containerId);
    if (listContainer.style.display === 'none' || listContainer.style.display === '') {
        listContainer.style.display = 'block';
    } else {
        listContainer.style.display = 'none';
    }
}

function toggleAll(masterCheckbox, containerId) {
    const listContainer = document.getElementById(containerId);
    const checkboxes = listContainer.querySelectorAll('.checkbox');
    checkboxes.forEach(checkbox => {
        checkbox.checked = masterCheckbox.checked;
    });
    checkDatabase();
}

function checkDatabase() {
    const output = document.getElementById('databaseOutput');
    const totals = { Время: { days: 0, hours: 0, minutes: 0 } };

    const checkboxes = document.querySelectorAll('.checkbox');
    checkboxes.forEach((checkbox) => {
        if (checkbox.checked && checkbox.nextSibling.textContent.trim()) {
            const name = checkbox.nextSibling.textContent.trim();
            const entry = database.find(item => item.startsWith(name));
            if (entry) {
                const parts = entry.split(', ');
                const timeStr = parts[1];
                const values = parts.slice(2).map(v => {
                    const valuePair = v.split(' ');
                    return { key: valuePair[0], value: parseInt(valuePair[1], 10) };
                });

                const { days, hours, minutes } = parseTime(timeStr);
                totals['Время'].days += days;
                totals['Время'].hours += hours;
                totals['Время'].minutes += minutes;

                values.forEach(({ key, value }) => {
                    if (totals[key]) {
                        totals[key] += value;
                    } else {
                        totals[key] = value;
                    }
                });
            }
        }
    });

    const formattedTime = formatTime(totals['Время'].days, totals['Время'].hours, totals['Время'].minutes);
    totals['Время'] = formattedTime;

    let tableHTML = '<table><tr><th>Ресурс</th><th>Значение</th></tr>';
    for (const [key, value] of Object.entries(totals)) {
        tableHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
    }
    tableHTML += '</table>';

    output.innerHTML = tableHTML;
}

function parseTime(timeStr) {
    const timeParts = timeStr.split('д ');
    const days = parseInt(timeParts[0], 10);
    const time = timeParts[1].split(':');
    const hours = parseInt(time[0], 10);
    const minutes = parseInt(time[1], 10);
    return { days, hours, minutes };
}

function formatTime(totalDays, totalHours, totalMinutes) {
    const days = totalDays + Math.floor((totalHours + Math.floor(totalMinutes / 60)) / 24);
    const hours = (totalHours + Math.floor(totalMinutes / 60)) % 24;
    const minutes = totalMinutes % 60;
    return `${days}д ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
}

document.querySelectorAll('.list-container').forEach(container => {
    container.style.display = 'none';
});
