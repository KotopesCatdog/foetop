<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параметры</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            background-color: black;
        }
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
             .menu-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 80%;
    max-width: 400px;
    padding: 40px;
    background-color: rgba(0, 0, 0, 0.7);
    border: 4px solid #008080;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
}
            .menu-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background-color: #008080;
    border: 4px solid black;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    text-align: center;
    text-decoration: none;
    transition: all 0.3s;
}
        .menu-btn:hover {
            background-color: #00a0a0;
            box-shadow: 0 0 25px rgba(0, 255, 255, 1);
            transform: scale(1.05);
        }
        .title {
    text-align: center;
    font-size: 36px;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff;
    margin-bottom: 20px;
    font-family: 'Courier New', monospace;
}

        /* Переключатель языка */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .lang-switcher button {
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
            background: transparent;
            border: 2px solid #008080;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-switcher button:hover,
        .lang-switcher button.active {
            background: #008080;
            color: white;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h class="title" data-i18n="param_title">Параметры</h>

        
        <a href="/param/foestat.html" target="_blank" class="menu-btn" data-i18n="param_btn_foestat">FOE RU статистика миров</a>
        <a href="/param/qitop.html" target="_blank" class="menu-btn">QI Leaderboards</a>
        <a href="/param/nauka.html" target="_self" class="menu-btn" data-i18n="param_btn_nauka">Стоимость науки</a>
        <a href="/maphelp/" target="_blank" class="menu-btn" data-i18n="param_btn_kratkart">Карты континентов</a>
        <a href="/param/maptime.html" target="_blank" class="menu-btn" data-i18n="param_btn_maptime"></a>
        <a href="/" target="_self" class="menu-btn" data-i18n="common_btn_back_menu">🏠 Возврат в меню</a>

        <div class="lang-switcher">
            <button data-lang-btn="ru" onclick="i18nSwitchTo('ru')">RU</button>
            <button data-lang-btn="en" onclick="i18nSwitchTo('en')">EN</button>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/game/krak/js/background2.js"></script>
</body>
</html>
