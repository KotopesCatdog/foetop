<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стоимость науки</title>
    <link rel="icon" href="https://foehelp.ru/favicon.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin: 30px 0 40px;
            font-size: 24px;
        }

       

        /* Обычный (не фиксированный) блок управления */
        .controls {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .db-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 28px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .control-btn:hover {
            background: #0055aa;
        }

        .db-name {
            min-width: 200px;
            max-width: 300px;
            width: 100%;
            height: 50px;
            background: #28a745;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 1;
        }

        .db-name.red {
            background: #dc3545;
        }

        /* Таблица */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #333;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #444;
            text-align: center;
        }

        td:last-child {
            text-align: right;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 480px) {
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 24px;
            }

            .db-name {
                height: 40px;
                font-size: 18px;
                min-width: 160px;
            }

            .controls {
                padding: 10px;
            }

            .back-button {
                padding: 8px 16px;
                font-size: 15px;
            }

            h1 {
                font-size: 20px;
                margin: 20px 0 30px;
            }
        }
    </style>
</head>
