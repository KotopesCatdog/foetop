<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расш. и брил. на картах</title>
    <link rel="icon" href="https://foehelp.ru/favicon.png" type="image/png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #5E381A;
            flex-direction: column;
        }
        .container {
            width: 90%;
            max-width: 900px;
            height: 550px;
            border: 4px solid black;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background-color: #5E381A;
            display: none; /* Скрываем контейнер с изображением по умолчанию */
            margin-bottom: 20px; /* Отступ снизу */
        }
        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 кнопки в ряду */
            gap: 10px; /* Расстояние между кнопками */
            width: 90%; /* Ширина контейнера с кнопками */
            max-width: 900px; /* Максимальная ширина */
            margin: 0 auto; /* Центрирование кнопок */
            border: 4px solid black; /* Рамка вокруг кнопок */
            border-radius: 15px; /* Закругление углов рамки */
            padding: 10px; /* Отступ внутри рамки */
            background-color: #5E381A; /* Цвет фона для кнопок */
        }
        .button {
            border-radius: 25px;
            background-color: #5E381A;
            color: #EFDBA6; /* Цвет текста */
            border: 1px solid #EFDBA6; /* Рамка кнопок */
            padding: 10px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%; /* Ширина кнопок 100% от родительского контейнера */
        }
        .button:hover {
            background-color: #2169D3;
        }
        .reset-button {
            position: absolute; /* Кнопка сброса внутри контейнера */
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        img {
            width: 100%;
            height: auto;
            position: absolute;
            cursor: pointer;
            touch-action: none;
            transform-origin: center; /* Центр для изменения размера */
        }
    </style>
</head>
<body>

    <div class="button-container" id="buttonContainer">
                <button class="button" data-image="https://static.wixstatic.com/media/27a41d_746f05f748424c4db6c96cffc8259235~mv2.png?text=Имя+1">Бр-Колон</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_6271e9718f254b3a9680c07c90bf29f2~mv2.png?text=Имя+2">Индуск</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_4b4cac77b05348a6a62a7ebb60cad0bf~mv2.png?text=Имя+3">Прогресс</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_bd4f040d392247a193991191ce788b51~mv2.png?text=Имя+4">Модерн</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_f14edbcff6c54f2f889760fbd4df148d~mv2.png?text=Имя+5">Постмод</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_54308d7919db4c14ba415eb9edf98528~mv2.png?text=Имя+6">Новейш</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_159009ad19ca4227979670198fdd2c67~mv2.png?text=Имя+7">Завтра</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_0eceeb0c530047d9b0044ab1fa72537d~mv2.png?text=Имя+8">Будка</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_524a2cda124241ffa5c9274a80ff17d7~mv2.png?text=Имя+9">Арктика</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_87d73caeea824c018a437e42bb805384~mv2.png?text=Имя+10">Океан-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_dc9b97bee3094272a0d2ca5a76538ddf~mv2.png?text=Имя+11">Океан-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_a458211ef7704b5a9f4d7d392670043a~mv2.png?text=Имя+12">Океан-3</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_1da6900f8f264866b93e76235320b597~mv2.png?text=Имя+13">Вирт-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_75f0ff8cf4e5481f8f6556f3ca14dedb~mv2.png?text=Имя+14">Вирт-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_50c12ce54e7c40d5935ce2508fe83bcd~mv2.png?text=Имя+15">Вирт-3</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_9afd24235222465c886938cea7862ae6~mv2.png?text=Имя+16">Марс-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_668587f1b62e4ccfa1eee92197097d6c~mv2.png?text=Имя+17">Марс-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_429cb92f4fe94573b18af30c9c42c26f~mv2.png?text=Имя+18">Пояс-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_924a1e838aca4dd899a03bad1a377ad6~mv2.png?text=Имя+19">Пояс-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_5d9a375abd9a4645b9442675e7d8dca4~mv2.png?text=Имя+20">Венера-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_c716da79205b4b37969f36bc309b9651~mv2.png?text=Имя+21">Венера-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_8789015a60b14b20a42fc10bad3c4e48~mv2.png?text=Имя+22">Юпитер-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_83f3f2257fa843c9b66409f663a2ab46~mv2.png?text=Имя+23">Юпитер-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_b69e3b1c2ac548bd8241efe1b6a0d26c~mv2.png?text=Имя+24">Титан-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_487fecc34cfc47c68fe10f0b3eac1d73~mv2.png?text=Имя+25">Титан-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_b48b8abe8bcb4518995528ebf0360900~mv2.png?text=Имя+26">Хаб-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_7603bfdbc3e64fccb5a7ddec65fefbf4~mv2.png?text=Имя+27">Хаб-2</button>
<button class="button" data-image="https://static.wixstatic.com/media/27a41d_9d77a2452b52405881ddb4def6ab91ce~mv2.jpg?text=Имя+28">Таблица</button>
    </div>

    <div class="container" id="container">
        <img id="draggable" src="https://static.wixstatic.com/media/27a41d_555ff5cd53ed4b558077cd49eabe851a~mv2.png?text=Текущее+изображение" alt="Изображение">
        <button class="reset-button" id="resetButton">Х</button>
    </div>

    <script>
        const img = document.getElementById('draggable');
        const container = document.getElementById('container');
        const resetButton = document.getElementById('resetButton');
        const buttonContainer = document.getElementById('buttonContainer');

        let currentScale = 1;
        let isDragging = false;
        let startX, startY;

        // Показать изображение при нажатии на кнопку
        buttonContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('button')) {
                const selectedImage = e.target.dataset.image;
                img.src = selectedImage;
                buttonContainer.style.display = 'none'; // Скрываем кнопки
                container.style.display = 'block'; // Показываем контейнер с изображением
                currentScale = 1; // Сбрасываем масштаб при выборе нового изображения
                img.style.transform = `scale(${currentScale})`; // Устанавливаем начальный масштаб
            }
        });

        img.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - img.offsetLeft;
            startY = e.clientY - img.offsetTop;
            e.preventDefault();
        });

        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { // Только один палец
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX - img.offsetLeft;
                startY = touch.clientY - img.offsetTop;
                e.preventDefault();
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                img.style.left = `${e.clientX - startX}px`;
                img.style.top = `${e.clientY - startY}px`;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const touch = e.touches[0];
                img.style.left = `${touch.clientX - startX}px`;
                img.style.top = `${touch.clientY - startY}px`;
            }
        });

        let initialDistance = 0;
        let isScaling = false; // Флаг для отслеживания изменения размера

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (!isScaling) {
                    initialDistance = distance;
                    isScaling = true; // Устанавливаем флаг изменения размера
                } else {
                    const scaleChange = distance / initialDistance;
                    currentScale *= scaleChange; // Обновляем текущий масштаб
                    currentScale = Math.min(Math.max(currentScale, 0.5), 3); // Ограничиваем масштаб
                    img.style.transform = `scale(${currentScale})`;
                    initialDistance = distance; // Обновляем начальное расстояние
                }
            }
        });

        container.addEventListener('touchend', () => {
            isScaling = false; // Сбрасываем флаг при завершении изменения размера
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const scaleChange = e.deltaY > 0 ? -0.1 : 0.1;
            currentScale += scaleChange; // Обновляем текущий масштаб
            currentScale = Math.min(Math.max(currentScale, 0.5), 3); // Ограничиваем масштаб
            img.style.transform = `scale(${currentScale})`;
        });

        resetButton.addEventListener('click', () => {
            // Сброс состояния страницы
            currentScale = 1;
            img.style.transform = `scale(${currentScale})`;
            img.style.left = '0px';
            img.style.top = '0px';
            img.src = "https://static.wixstatic.com/media/27a41d_555ff5cd53ed4b558077cd49eabe851a~mv2.png?text=Текущее+изображение"; // Сброс изображения
            buttonContainer.style.display = 'grid'; // Показываем кнопки
            container.style.display = 'none'; // Скрываем контейнер с изображением
            initialDistance = 0; // Сброс дистанции
        });
    </script>

</body>
</html>
