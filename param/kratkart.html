<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кратчайшие карты</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #5E381A;
            flex-direction: column;
        }
        .container {
            width: 90%;
            max-width: 900px;
            height: 550px;
            border: 4px solid black;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background-color: #5E381A;
            display: none; /* Скрываем контейнер с изображением по умолчанию */
            margin-bottom: 20px; /* Отступ снизу */
        }
        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 кнопки в ряду */
            gap: 10px; /* Расстояние между кнопками */
            width: 90%; /* Ширина контейнера с кнопками */
            max-width: 900px; /* Максимальная ширина */
            margin: 0 auto; /* Центрирование кнопок */
            border: 4px solid black; /* Рамка вокруг кнопок */
            border-radius: 15px; /* Закругление углов рамки */
            padding: 10px; /* Отступ внутри рамки */
            background-color: #5E381A; /* Цвет фона для кнопок */
        }
        .button {
            border-radius: 25px;
            background-color: #5E381A;
            color: #EFDBA6; /* Цвет текста */
            border: 1px solid #EFDBA6; /* Рамка кнопок */
            padding: 10px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%; /* Ширина кнопок 100% от родительского контейнера */
        }
        .button:hover {
            background-color: #2169D3;
        }
        .reset-button {
            position: absolute; /* Кнопка сброса внутри контейнера */
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        img {
            width: 100%;
            height: auto;
            position: absolute;
            cursor: pointer;
            touch-action: none;
            transform-origin: center; /* Центр для изменения размера */
        }
    </style>
</head>
<body>

    <div class="button-container" id="buttonContainer">
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_604e1ffeff46438b8c7fc8029aff7c20~mv2.jpg?text=Имя+1">ЖВ-Колон</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_5ce05cb876bc42a0aeb9f722c483ffc8~mv2.jpg?text=Имя+2">Индуск</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_e81bda65341f45e88b5dd83c9e637fbf~mv2.jpg?text=Имя+3">Постмодерн</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_5d648c6508ad4627bcdf16727461d74e~mv2.jpg?text=Имя+4">Новейшее</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_38eae5249eb44dac962049adf1e379a9~mv2.jpg?text=Имя+5">Завтра</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_df7f5f5d1b33493f8cdf38187837999a~mv2.jpg?text=Имя+6">Арктика</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_e2df70cc08874e7fa58fdb3462a2af5b~mv2.png?text=Имя+7">Океан-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_aa3fd53bddbd4f0b841f6d4f838ea60e~mv2.png?text=Имя+8">Океан-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_87b4075972954c6c8e9415ca68afa797~mv2.png?text=Имя+9">Океан-3</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_f2fdfdd09eb74596ae84792e7233801b~mv2.png?text=Имя+10">Вирт-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_81690431bb8c4a1bbc8a9742ba9c2980~mv2.png?text=Имя+11">Вирт-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_591ad3bedd1f4b9aa080bf6526f23c94~mv2.png?text=Имя+12">Вирт-3</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_561b86ef513647ddade56d48755fc77b~mv2.png?text=Имя+13">Марс-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_6392272379d54cfe8773f0989ec02575~mv2.png?text=Имя+14">Марс-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_a231762b98f94fe8b22cd753c3f1aa8b~mv2.png?text=Имя+15">Пояс-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_ffdc714478f148dea52b7c3dbb77e9f6~mv2.png?text=Имя+16">Пояс-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_56c80a476588405ba7a18905999c2770~mv2.png?text=Имя+27">Венера-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_8aa9fe14cbad498fadb34455b0e90a88~mv2.png?text=Имя+18">Венера-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_4de6959cb7dc4080b440c6aac7f7e4df~mv2.png?text=Имя+19">Юпитер-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_9063b58de33d4aec99d86529d52f060d~mv2.png?text=Имя+20">Юпитер-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_3e59b690544c4a9f9088449a707ad063~mv2.png?text=Имя+21">Титан-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_bfe4f7a9a86f49c382ff2984702526d5~mv2.png?text=Имя+22">Титан-2</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_3ea1ddeecb74445b8215031377509f43~mv2.png?text=Имя+23">Хаб-1</button>
        <button class="button" data-image="https://static.wixstatic.com/media/27a41d_a175d789357347c7a7aa21325acbfb9f~mv2.png?text=Имя+24">Хаб-2</button>

    </div>

    <div class="container" id="container">
        <img id="draggable" src="https://static.wixstatic.com/media/27a41d_82e3364793734fb398ffa16d6cd1c728~mv2.png?text=Текущее+изображение" alt="Изображение">
        <button class="reset-button" id="resetButton">Х</button>
    </div>

    <script>
        const img = document.getElementById('draggable');
        const container = document.getElementById('container');
        const resetButton = document.getElementById('resetButton');
        const buttonContainer = document.getElementById('buttonContainer');

        let currentScale = 1;
        let isDragging = false;
        let startX, startY;

        // Показать изображение при нажатии на кнопку
        buttonContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('button')) {
                const selectedImage = e.target.dataset.image;
                img.src = selectedImage;
                buttonContainer.style.display = 'none'; // Скрываем кнопки
                container.style.display = 'block'; // Показываем контейнер с изображением
                currentScale = 1; // Сбрасываем масштаб при выборе нового изображения
                img.style.transform = `scale(${currentScale})`; // Устанавливаем начальный масштаб
            }
        });

        img.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - img.offsetLeft;
            startY = e.clientY - img.offsetTop;
            e.preventDefault();
        });

        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { // Только один палец
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX - img.offsetLeft;
                startY = touch.clientY - img.offsetTop;
                e.preventDefault();
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                img.style.left = `${e.clientX - startX}px`;
                img.style.top = `${e.clientY - startY}px`;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const touch = e.touches[0];
                img.style.left = `${touch.clientX - startX}px`;
                img.style.top = `${touch.clientY - startY}px`;
            }
        });

        let initialDistance = 0;
        let isScaling = false; // Флаг для отслеживания изменения размера

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (!isScaling) {
                    initialDistance = distance;
                    isScaling = true; // Устанавливаем флаг изменения размера
                } else {
                    const scaleChange = distance / initialDistance;
                    currentScale *= scaleChange; // Обновляем текущий масштаб
                    currentScale = Math.min(Math.max(currentScale, 0.5), 3); // Ограничиваем масштаб
                    img.style.transform = `scale(${currentScale})`;
                    initialDistance = distance; // Обновляем начальное расстояние
                }
            }
        });

        container.addEventListener('touchend', () => {
            isScaling = false; // Сбрасываем флаг при завершении изменения размера
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const scaleChange = e.deltaY > 0 ? -0.1 : 0.1;
            currentScale += scaleChange; // Обновляем текущий масштаб
            currentScale = Math.min(Math.max(currentScale, 0.5), 3); // Ограничиваем масштаб
            img.style.transform = `scale(${currentScale})`;
        });

        resetButton.addEventListener('click', () => {
            // Сброс состояния страницы
            currentScale = 1;
            img.style.transform = `scale(${currentScale})`;
            img.style.left = '0px';
            img.style.top = '0px';
            img.src = "https://static.wixstatic.com/media/27a41d_82e3364793734fb398ffa16d6cd1c728~mv2.png?text=Текущее+изображение"; // Сброс изображения
            buttonContainer.style.display = 'grid'; // Показываем кнопки
            container.style.display = 'none'; // Скрываем контейнер с изображением
            initialDistance = 0; // Сброс дистанции
        });
    </script>

</body>
</html>
