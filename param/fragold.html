      body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #eee;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    input#search {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: white;
    }
    #toggle-all {
      margin-bottom: 10px;
      padding: 6px 12px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #toggle-all:hover {
      background: #0055aa;
    }
    .building {
      border-bottom: 1px solid #444;
      padding: 10px 0;
      cursor: pointer;
    }
    .building-header {
      font-weight: bold;
      color: #4fc3f7; /* голубой цвет, как в FoE */
      display: flex;
      align-items: center;
    }
    .building-header::before {
      content: "▶ ";
      margin-right: 6px;
      transition: transform 0.2s;
    }
    .building.open .building-header::before {
      content: "▼ ";
    }
    .rewards {
      margin-top: 8px;
      padding-left: 24px;
      display: none;
      color: #ccc;
    }
    .building.open .rewards {
      display: block;
    }
    .reward-item {
      margin: 4px 0;
    }
	
	mark {
  background-color: #ffeb3b; /* ярко-жёлтый, как в поиске */
  color: #000;
  padding: 0 2px;
  border-radius: 2px;
}

    // ▲▲▲ КОНЕЦ ВСТАВКИ ▲▲▲

    const buildingsList = [];
    for (const [id, data] of Object.entries(CityEntities)) {
      const seen = new Set();
      const uniqueRewards = [];
      for (const r of data.rewards) {
        const key = r.name;
        if (!seen.has(key)) {
          seen.add(key);
          uniqueRewards.push(r);
        }
      }
      buildingsList.push({
        id: id,
        name: data.name,
        rewards: uniqueRewards
      });
    }
    buildingsList.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

    const resultsDiv = document.getElementById('results');
    const searchInput = document.getElementById('search');
    const toggleAllBtn = document.getElementById('toggle-all');

    let allExpanded = false;

function render() {
  const query = searchInput.value.trim();
  resultsDiv.innerHTML = '';

  const filtered = buildingsList.filter(b => {
    const matchesBuilding = b.name.toLowerCase().includes(query.toLowerCase());
    const matchesReward = b.rewards.some(r => r.name.toLowerCase().includes(query.toLowerCase()));
    return query === '' || matchesBuilding || matchesReward;
  });

  if (filtered.length === 0) {
    resultsDiv.innerHTML = '<p>Ничего не найдено.</p>';
    return;
  }

  // Функция для подсветки текста
  const highlight = (text, query) => {
    if (!query) return text;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  };

  filtered.forEach(b => {
    const div = document.createElement('div');
    div.className = 'building';

    const highlightedBuildingName = highlight(b.name, query);

    const rewardsHtml = b.rewards.map(r => {
      const highlightedReward = highlight(r.name, query);
      return `<div class="reward-item">${highlightedReward}</div>`;
    }).join('');

    div.innerHTML = `
      <div class="building-header">${highlightedBuildingName}</div>
      <div class="rewards">${rewardsHtml}</div>
    `;

    div.addEventListener('click', () => {
      div.classList.toggle('open');
    });

    resultsDiv.appendChild(div);
  });
}
		
		
        
    toggleAllBtn.addEventListener('click', () => {
      const buildings = resultsDiv.querySelectorAll('.building');
      if (allExpanded) {
        buildings.forEach(b => b.classList.remove('open'));
        toggleAllBtn.textContent = 'Развернуть все';
      } else {
        buildings.forEach(b => b.classList.add('open'));
        toggleAllBtn.textContent = 'Свернуть все';
      }
      allExpanded = !allExpanded;
    });

    searchInput.addEventListener('input', render);
    render();
  </script>
