<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QI Leaderboards — все миры RU | ТОП гильдий</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b1120; font-family: 'Segoe UI', system-ui, sans-serif; color: #e7edf4; padding: 24px 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { margin-bottom: 28px; }
    h1 { font-size: 1.8rem; background: linear-gradient(145deg, #b77cff, #5294ff); background-clip: text; -webkit-background-clip: text; color: transparent; display: inline-block; }
    .badge { background: #1e2a3e; font-size: 0.7rem; padding: 4px 12px; border-radius: 40px; margin-left: 12px; }
    .sub { color: #8ca3c0; border-left: 3px solid #3b82f6; padding-left: 16px; margin: 12px 0 24px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: #0f172a; padding: 12px 24px; border-radius: 48px; margin-bottom: 24px; }
    .btn-excel { background: #1e6f3f; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-top { background: #8b5cf6; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-worlds { background: #3b82f6; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-excel:disabled, .btn-top:disabled, .btn-worlds:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { flex: 1; height: 8px; background: #1f2a44; border-radius: 10px; max-width: 200px; }
    .progress-fill { height: 100%; background: #4c9aff; width: 0%; transition: width 0.2s; border-radius: 10px; }
    .stats-badge { background: #03070f; padding: 6px 14px; border-radius: 32px; font-family: monospace; font-size: 0.75rem; }
    .top-selector { display: flex; align-items: center; gap: 12px; background: #1e2a3e; padding: 6px 16px; border-radius: 40px; }
    .top-selector label { font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .top-selector input { margin: 0; width: 18px; height: 18px; cursor: pointer; accent-color: #8b5cf6; }
    .top-selector select { background: #0f172a; border: 1px solid #3b82f6; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.85rem; cursor: pointer; }
    .world-tabs { display: flex; flex-wrap: wrap; gap: 8px; background: #111827; padding: 12px 16px; border-radius: 48px; margin-bottom: 24px; }
    .world-btn { background: transparent; border: none; padding: 8px 18px; border-radius: 40px; cursor: pointer; color: #b9ceff; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .world-btn:hover { background: #1f2c44; color: white; }
    .world-btn.active { background: #2f4b8c; color: white; }
    .world-btn.loaded::before { content: "✓ "; color: #2ecc71; }
    .info-panel { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 24px; border-radius: 32px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .selected-world { font-size: 1.3rem; font-weight: 800; background: linear-gradient(120deg, #f5b042, #ff7c3a); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .update-time { font-size: 0.75rem; color: #7d8fb3; font-family: monospace; }
    .table-wrapper { background: #0e1622; border-radius: 24px; border: 1px solid #253449; overflow-x: auto; }
    .guilds-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 700px; }
    .guilds-table th { background: #0b1121; color: #bfd6ff; font-weight: 600; padding: 14px 10px; border-bottom: 1px solid #253449; white-space: nowrap; }
    .guilds-table td { padding: 12px 10px; border-bottom: 1px solid #1f2a3e; vertical-align: middle; }
    .guilds-table tr:hover td { background: #111b2c; }
    .rank-cell { font-weight: 700; color: #ffd966; width: 50px; text-align: center; }
    .guild-cell { min-width: 220px; }
    .guild-name { font-weight: 600; }
    .guild-link { color: #7eb3ff; text-decoration: none; }
    .guild-link:hover { color: #ffbc6e; text-decoration: underline; }
    .tier-badge { display: inline-block; background: #1f2b40; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; color: #ffcf7a; margin-top: 4px; margin-right: 6px; }
    .world-badge { display: inline-block; background: #2d3a5e; padding: 2px 8px; border-radius: 16px; font-size: 0.65rem; font-weight: 600; color: #a0b4e0; margin-top: 4px; }
    .points-cell { font-weight: 700; color: #a7e05e; text-align: right; white-space: nowrap; }
    .member-cell { font-weight: bold; color: #6ee7b7; text-align: center; white-space: nowrap; }
    .rank-change-cell { text-align: center; white-space: nowrap; }
    .rank-change { background: #0e1f2c; padding: 2px 8px; border-radius: 30px; display: inline-block; font-size: 0.8rem; }
    .positive { color: #78e08f; }
    .negative { color: #f28b82; }
    .champ-cell { text-align: center; white-space: nowrap; }
    .loading-overlay { display: flex; justify-content: center; align-items: center; padding: 60px; gap: 12px; }
    .spinner { width: 26px; height: 26px; border: 3px solid #2c4268; border-top: 3px solid #6495ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 32px; text-align: center; font-size: 0.7rem; color: #3a4b6e; padding: 16px; }
    .mode-indicator { background: #1e2a3e; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; margin-left: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
  <h1>⚔️ QI Leaderboards</h1>
  <div class="sub" style="border-left-color: #facc15; font-weight: 700; color: #e2e8f0; font-style: italic; font-size: 1rem;">
    "Светлая аналитика по квантовым командам"
  </div>
  <div style="margin-top: 6px;">
    <span style="background: linear-gradient(135deg, #1e293b, #0f172a); padding: 4px 12px; border-radius: 40px; font-size: 0.8rem; color: #94a3b8; display: inline-block;">
      🤝 подготовлена совместно с руководителем ГИ <strong style="color: #ffffff; font-weight: 800;">«Путь Светлых» (Одрвар)</strong>
    </span>
  </div>
</div>

  <div class="toolbar">
    <button id="topGuildsBtn" class="btn-top">🏆 ТОП гильдий среди всех миров</button>
    <div id="topSelectorPanel" style="display: none;" class="top-selector">
      <label>📊 Показать:</label>
      <select id="topCountSelect">
        <option value="10">ТОП-10</option>
        <option value="25">ТОП-25</option>
        <option value="50" selected>ТОП-50</option>
        <option value="100">ТОП-100</option>
      </select>
    </div>
    <button id="worldsViewBtn" class="btn-worlds">🌍 Показать миры</button>
    <button id="exportBtn" class="btn-excel" disabled>📎 Экспорт в Excel</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats-badge" id="loadStats">⏳ загрузка...</div>
  </div>

  <div id="worldTabsContainer" style="display: flex;" class="world-tabs"></div>

  <div class="info-panel">
    <div>🏆 <span class="selected-world" id="currentWorldSpan">—</span><span id="modeIndicator" class="mode-indicator">режим: миры</span></div>
    <div class="update-time" id="updateTime"></div>
  </div>

  <div id="tableContainer"><div class="loading-overlay"><div class="spinner"></div><span>Загрузка QI рейтинга...</span></div></div>
  <footer>📡 Данные: foestat (C)</footer>
</div>

<script>
  const WORLDS = ["ru1","ru2","ru3","ru4","ru5","ru6","ru7","ru8","ru9","ru10","ru11","ru12","ru13","ru14","ru15","ru16"];
  const WORLD_NAMES = {
    ru1:"Арвахал", ru2:"Брисгард", ru3:"Сигард", ru4:"Дайнинг", ru5:"Нагах", ru6:"Фел Драгнир",
    ru7:"Грейфентал", ru8:"Хаундсмур", ru9:"Джаймс", ru10:"Кроуч", ru11:"Лангендорн",
    ru12:"Маунт Киллмор", ru13:"Норсил", ru14:"Одрвар", ru15:"Паркорг", ru16:"Кунрир"
  };
  const REGION = "ru";

  let worldsData = new Map();
  let currentWorld = "ru1";
  let loadedWorlds = 0;
  let totalMemberRequests = 0;
  let currentMode = "worlds"; // "worlds" или "top"
  let allGuildsList = [];

  async function fetchGuildMemberCount(worldId, guildId) {
    const url = `https://api.forge-db.com/api/guilds/${REGION}/${worldId}/${guildId}`;
    try {
      const response = await fetch(url);
      const json = await response.json();
      if (json.success && json.data && json.data.members_count) {
        return parseInt(json.data.members_count, 10);
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  async function loadWorldData(worldId) {
    const qiUrl = `https://api.forge-db.com/api/qi/${REGION}/${worldId}?limit=50`;
    try {
      const response = await fetch(qiUrl);
      const json = await response.json();
      if (!json.success || !json.data) throw new Error("Нет данных");
      
      const sorted = [...json.data].sort((a,b) => (b.qi_points||0) - (a.qi_points||0));
      const top20 = sorted.slice(0,20);
      
      const membersPromises = top20.map(g => fetchGuildMemberCount(worldId, g.guild_id));
      const membersCounts = await Promise.all(membersPromises);
      
      const top20WithMembers = top20.map((g, idx) => ({
        ...g,
        member_count: membersCounts[idx] || 0,
        world_id: worldId,
        world_name: WORLD_NAMES[worldId]
      }));
      
      totalMemberRequests += top20.length;
      
      worldsData.set(worldId, {
        top20: top20WithMembers,
        timestamp: Date.now()
      });
      
      allGuildsList.push(...top20WithMembers);
      
      return true;
    } catch (err) {
      worldsData.set(worldId, { top20: [], error: err.message, timestamp: Date.now() });
      return false;
    }
  }

  async function loadAllWorlds() {
    loadedWorlds = 0;
    totalMemberRequests = 0;
    allGuildsList = [];
    worldsData.clear();
    document.getElementById('exportBtn').disabled = true;
    document.getElementById('topGuildsBtn').disabled = true;
    document.getElementById('worldsViewBtn').disabled = true;
    
    const promises = WORLDS.map(w => loadWorldData(w));
    await Promise.all(promises);
    
    for (let i = 0; i < WORLDS.length; i++) {
      loadedWorlds++;
      const percent = (loadedWorlds / WORLDS.length) * 100;
      document.getElementById('progressFill').style.width = `${percent}%`;
      document.getElementById('loadStats').innerHTML = `📊 миры: ${loadedWorlds}/${WORLDS.length} | запросов: ${totalMemberRequests}`;
    }
    
    document.getElementById('exportBtn').disabled = false;
    document.getElementById('topGuildsBtn').disabled = false;
    document.getElementById('worldsViewBtn').disabled = false;
    
    allGuildsList.sort((a,b) => b.qi_points - a.qi_points);
    
    renderWorldsView();
  }

  function renderWorldsView() {
    currentMode = "worlds";
    document.getElementById('modeIndicator').innerHTML = "режим: миры";
    document.getElementById('worldTabsContainer').style.display = "flex";
    document.getElementById('topSelectorPanel').style.display = "none";
    
    const data = worldsData.get(currentWorld);
    if (!data || data.error) {
      document.getElementById('tableContainer').innerHTML = `<div class="loading-overlay">❌ Ошибка: ${data?.error || 'нет данных'}</div>`;
      return;
    }
    
    const guilds = data.top20;
    if (!guilds.length) {
      document.getElementById('tableContainer').innerHTML = `<div class="loading-overlay">📭 Нет данных для ${currentWorld}</div>`;
      return;
    }
    
    let html = `<div class="table-wrapper"><table class="guilds-table">
      <thead>
        <tr><th>#</th><th>Гильдия</th><th>QI очки</th><th>👥 Участники</th><th>Δ ранга</th><th>🏆 Чемпионства</th></tr>
      </thead>
      <tbody>`;
    
    for (let i = 0; i < guilds.length; i++) {
      const g = guilds[i];
      const rankChange = g.qi_rank_change;
      let changeHtml = '<span class="rank-change">—</span>';
      if (rankChange && rankChange !== 0) {
        changeHtml = `<span class="rank-change ${rankChange > 0 ? 'positive' : 'negative'}">${rankChange > 0 ? '▲' : '▼'} ${Math.abs(rankChange)}</span>`;
      }
      const tier = g.reward_asset_id ? `Tier ${g.reward_asset_id}` : '';
      const memberCount = (g.member_count && g.member_count > 0) ? g.member_count.toLocaleString() : '—';
      const guildUrl = `https://foestats.com/${REGION}/${currentWorld}/guilds/${g.guild_id}`;
      
      html += `<tr>
        <td class="rank-cell">${i+1}</td>
        <td class="guild-cell"><div class="guild-name"><a href="${guildUrl}" target="_blank" class="guild-link">${escapeHtml(g.name)}</a></div>${tier ? `<div class="tier-badge">🏆 ${tier}</div>` : ''}</td>
        <td class="points-cell">${g.qi_points.toLocaleString()}</td>
        <td class="member-cell">${memberCount}</td>
        <td class="rank-change-cell">${changeHtml}</td>
        <td class="champ-cell">${g.championships_won || '—'}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
    document.getElementById('tableContainer').innerHTML = html;
    document.getElementById('currentWorldSpan').innerHTML = `${currentWorld.toUpperCase()} — ${WORLD_NAMES[currentWorld]}`;
    document.getElementById('updateTime').innerHTML = `📅 ${new Date(data.timestamp).toLocaleString()}`;
  }

  function renderTopGuilds() {
    currentMode = "top";
    const topCount = parseInt(document.getElementById('topCountSelect').value, 10);
    
    document.getElementById('modeIndicator').innerHTML = `режим: ТОП-${topCount} всех миров`;
    document.getElementById('worldTabsContainer').style.display = "none";
    document.getElementById('topSelectorPanel').style.display = "flex";
    
    const topGuilds = allGuildsList.slice(0, topCount);
    
    if (!topGuilds.length) {
      document.getElementById('tableContainer').innerHTML = `<div class="loading-overlay">📭 Нет данных для ТОПа</div>`;
      return;
    }
    
    let html = `<div class="table-wrapper"><table class="guilds-table">
      <thead><tr><th>#</th><th>Гильдия / Мир</th><th>QI очки</th><th>👥 Участники</th><th>Δ ранга</th><th>🏆 Чемпионства</th></tr></thead>
      <tbody>`;
    
    for (let i = 0; i < topGuilds.length; i++) {
      const g = topGuilds[i];
      const rankChange = g.qi_rank_change;
      let changeHtml = '<span class="rank-change">—</span>';
      if (rankChange && rankChange !== 0) {
        changeHtml = `<span class="rank-change ${rankChange > 0 ? 'positive' : 'negative'}">${rankChange > 0 ? '▲' : '▼'} ${Math.abs(rankChange)}</span>`;
      }
      const tier = g.reward_asset_id ? `Tier ${g.reward_asset_id}` : '';
      const memberCount = (g.member_count && g.member_count > 0) ? g.member_count.toLocaleString() : '—';
      const guildUrl = `https://foestats.com/${REGION}/${g.world_id}/guilds/${g.guild_id}`;
      
      html += `<tr>
        <td class="rank-cell">${i+1}</td>
        <td class="guild-cell">
          <div class="guild-name"><a href="${guildUrl}" target="_blank" class="guild-link">${escapeHtml(g.name)}</a></div>
          <div class="world-badge">🌍 ${g.world_id.toUpperCase()} — ${g.world_name}</div>
          ${tier ? `<div class="tier-badge">🏆 ${tier}</div>` : ''}
        </td>
        <td class="points-cell">${g.qi_points.toLocaleString()}</td>
        <td class="member-cell">${memberCount}</td>
        <td class="rank-change-cell">${changeHtml}</td>
        <td class="champ-cell">${g.championships_won || '—'}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
    document.getElementById('tableContainer').innerHTML = html;
    document.getElementById('currentWorldSpan').innerHTML = `🏆 ТОП-${topCount} гильдий среди всех миров`;
    document.getElementById('updateTime').innerHTML = `📅 ${new Date().toLocaleString()}`;
  }

  function exportToExcel() {
    const wb = XLSX.utils.book_new();
    
    // Сводка по мирам
    const summaryRows = [["Мир", "Название мира", "Топ-1 гильдия", "QI очки лидера", "Участников", "Дата"]];
    for (const world of WORLDS) {
      const data = worldsData.get(world);
      if (data?.top20?.[0]) {
        const top = data.top20[0];
        summaryRows.push([world, WORLD_NAMES[world], top.name, top.qi_points, top.member_count || 0, new Date(data.timestamp).toLocaleString()]);
      } else {
        summaryRows.push([world, WORLD_NAMES[world], "—", "—", "—", "—"]);
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "Сводка_по_мирам");
    
    // ТОП-100 всех миров
    const sortedAll = [...allGuildsList].sort((a,b) => b.qi_points - a.qi_points);
    const top100 = sortedAll.slice(0, 100);
    const topRows = [["Rank", "Мир", "Guild ID", "Название гильдии", "Участники", "QI Points", "QI Rank", "Rank Change", "Championships", "Tier", "URL"]];
    top100.forEach((g, i) => {
      topRows.push([i+1, g.world_id, g.guild_id, g.name, g.member_count || 0, g.qi_points, g.qi_rank || "", g.qi_rank_change || 0, g.championships_won || 0, g.reward_asset_id ? `Tier ${g.reward_asset_id}` : "", `https://foestats.com/${REGION}/${g.world_id}/guilds/${g.guild_id}`]);
    });
    const wsTop = XLSX.utils.aoa_to_sheet(topRows);
    wsTop["!cols"] = [{wch:6},{wch:6},{wch:10},{wch:30},{wch:10},{wch:12},{wch:8},{wch:10},{wch:12},{wch:10},{wch:35}];
    XLSX.utils.book_append_sheet(wb, wsTop, "ТОП-100_всех_миров");
    
    // Отдельные листы по мирам
    for (const world of WORLDS) {
      const data = worldsData.get(world);
      const rows = [["Rank", "Guild ID", "Название гильдии", "Участники", "QI Points", "QI Rank", "Rank Change", "Championships", "Tier", "URL"]];
      if (data?.top20?.length) {
        data.top20.forEach((g, i) => {
          rows.push([i+1, g.guild_id, g.name, g.member_count || 0, g.qi_points, g.qi_rank || "", g.qi_rank_change || 0, g.championships_won || 0, g.reward_asset_id ? `Tier ${g.reward_asset_id}` : "", `https://foestats.com/${REGION}/${world}/guilds/${g.guild_id}`]);
        });
      } else {
        rows.push(["Нет данных", data?.error || "Ошибка"]);
      }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      let sheetName = `${world.toUpperCase()}_${WORLD_NAMES[world].substring(0, 10)}`.replace(/[\\/*?:[\]]/g, '').slice(0, 31);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    }
    
    XLSX.writeFile(wb, `QI_leaderboards_RU_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
  }

  function buildTabs() {
    const container = document.getElementById('worldTabsContainer');
    container.innerHTML = '';
    WORLDS.forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'world-btn';
      if (w === currentWorld) btn.classList.add('active');
      btn.textContent = `${w.toUpperCase()} · ${WORLD_NAMES[w]}`;
      btn.dataset.world = w;
      btn.onclick = () => {
        if (currentMode === "top") renderWorldsView();
        currentWorld = w;
        document.querySelectorAll('.world-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderWorldsView();
      };
      container.appendChild(btn);
    });
  }

  buildTabs();
  loadAllWorlds();
  
  document.getElementById('exportBtn').onclick = exportToExcel;
  document.getElementById('topGuildsBtn').onclick = () => renderTopGuilds();
  document.getElementById('worldsViewBtn').onclick = renderWorldsView;
  document.getElementById('topCountSelect').onchange = () => { if (currentMode === "top") renderTopGuilds(); };
</script>
</body>
</html>
