            <!-- Окно поиска под кнопкой -->
<div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск локаций (мин. 3 символа)" autocomplete="off">

            <div class="stats-header" data-i18n="stats_header">📊 Сводка ресурсов</div>
            <div id="databaseOutput">
                <div class="empty-state" data-i18n="empty_state">⚡ Отметьте локации, чтобы начать расчёт</div>

<script src="database.js"></script>
<script src="categories.js"></script>
<script>
    // ==================== ЛОКАЛИЗАЦИЯ ====================
    const translations = {
        ru: {
            title: "🗺️ Время и ресурсы на карту",
            subtitle: "Выберите нужные локации — получите точную сводку ресурсов и времени",
            select_all: "Выбрать / Снять всё",
            stats_header: "📊 Сводка ресурсов",
            empty_state: "⚡ Отметьте локации, чтобы начать расчёт",
            footer: "🔮 Актуальные данные по всем эпохам | Суммирование ресурсов и времени",
            resource_time: "Время",
            resource_coins: "Монеты",
            search_placeholder: "🔍 Поиск локаций (мин. 3 символа)",
            no_results: "😕 Ничего не найдено по запросу"
        },
        en: {
            title: "🗺️ Time and resources on the Maps",
            subtitle: "Select the locations you need — get an accurate summary of resources and time",
            select_all: "Select all / Deselect all",
            stats_header: "📊 Resource Summary",
            empty_state: "⚡ Mark locations to start calculation",
            footer: "🔮 Up-to-date data for all eras | Resource and time summation",
            resource_time: "Time",
            resource_coins: "Coins",
            search_placeholder: "🔍 Search locations (min 3 chars)",
            no_results: "😕 No matches found for your query"
        }
    };

    let currentLang = 'ru';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('maptime_lang', lang);
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key]) {
                if (el.tagName === 'INPUT') {
                    el.value = translations[lang][key];
                } else {
                    el.innerHTML = translations[lang][key];
                }
            }
        });
        
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.placeholder = translations[lang].search_placeholder;
        }
        
        document.title = translations[lang].title.replace('🗺️ ', '');
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (typeof window.checkDatabase === 'function') {
            window.checkDatabase();
        }
        applySearchAndHighlight();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const lang = btn.getAttribute('data-lang');
            setLanguage(lang);
        });
    });
    
    const savedLang = localStorage.getItem('maptime_lang');
    if (savedLang && (savedLang === 'ru' || savedLang === 'en')) {
        setLanguage(savedLang);
    } else {
        setLanguage('ru');
    }

    // ==================== ОСНОВНАЯ ЛОГИКА ====================
    
    function parseTime(timeStr) {
        const parts = timeStr.split('д ');
        const days = parseInt(parts[0], 10);
        const time = parts[1].split(':');
        return { days, hours: parseInt(time[0], 10), minutes: parseInt(time[1], 10) };
    }

    function formatTime(totalDays, totalHours, totalMinutes) {
        const extraDays = Math.floor((totalHours + Math.floor(totalMinutes / 60)) / 24);
        const days = totalDays + extraDays;
        const hours = (totalHours + Math.floor(totalMinutes / 60)) % 24;
        const minutes = totalMinutes % 60;
        return `${days}д ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    window.checkDatabase = function() {
        const output = document.getElementById('databaseOutput');
        const totals = { Время: { days: 0, hours: 0, minutes: 0 } };
        const resourceOrder = [];
        const seenResources = new Set();
        
        const allCheckboxes = document.querySelectorAll('.item-row input[type="checkbox"]');
        allCheckboxes.forEach(cb => {
            if (cb.checked) {
                const itemName = cb.getAttribute('data-name');
                const entry = database.find(item => item.startsWith(itemName));
                if (entry) {
                    const parts = entry.split(', ');
                    const timeStr = parts[1];
                    const timeData = parseTime(timeStr);
                    totals['Время'].days += timeData.days;
                    totals['Время'].hours += timeData.hours;
                    totals['Время'].minutes += timeData.minutes;
                    
                    for (let i = 2; i < parts.length; i++) {
                        const pair = parts[i].trim().split(' ');
                        if (pair.length >= 2) {
                            const key = pair[0];
                            const val = parseInt(pair[1], 10);
                            if (totals[key]) {
                                totals[key] += val;
                            } else {
                                totals[key] = val;
                            }
                            if (!seenResources.has(key)) {
                                seenResources.add(key);
                                resourceOrder.push(key);
                            }
                        }
                    }
                }
            }
        });
        
        const formattedTime = formatTime(totals['Время'].days, totals['Время'].hours, totals['Время'].minutes);
        
        let html = '<table class="resource-table"><thead><tr><th>📦 ' + (currentLang === 'ru' ? 'Ресурс' : 'Resource') + '</th><th>🔢 ' + (currentLang === 'ru' ? 'Значение' : 'Value') + '</th></tr></thead><tbody>';
        const timeLabel = currentLang === 'ru' ? 'Время' : 'Time';
        html += `<tr><td>${timeLabel}</td><td class="value-highlight">⏱️ ${formattedTime}</td></tr>`;
        
        for (const key of resourceOrder) {
            let displayValue = totals[key];
            let displayKey = key;
            if (key === 'Монеты') {
                displayValue = `💰 ${displayValue.toLocaleString()}`;
                displayKey = currentLang === 'ru' ? 'Монеты' : 'Coins';
            }
            html += `<tr><td>${displayKey}</td><td class="value-highlight">${displayValue}</td></tr>`;
        }
        
        html += '</tbody></table>';
        
        const hasAnySelection = Array.from(allCheckboxes).some(cb => cb.checked);
        if (!hasAnySelection) {
            html = '<div class="empty-state" data-i18n="empty_state">' + (currentLang === 'ru' ? '⚡ Отметьте локации, чтобы начать расчёт' : '⚡ Mark locations to start calculation') + '</div>';
        }
        
        output.innerHTML = html;
    };

    function highlightText(text, query) {
        if (!query || query.length < 3) return text;
        const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedQuery})`, 'gi');
        return text.replace(regex, `<span class="search-highlight">$1</span>`);
    }

    function applySearchAndHighlight() {
        const searchInput = document.getElementById('searchInput');
        const searchStats = document.getElementById('searchStats');
        const noResultsDiv = document.getElementById('noResultsMessage');
        const categoriesContainer = document.getElementById('categoriesContainer');
        
        let query = searchInput.value.trim();
        
        if (query.length === 0) {
            searchStats.innerHTML = '';
            if (noResultsDiv) noResultsDiv.style.display = 'none';
            resetSearchHighlightAndExpand();
            return;
        }
        
        if (query.length < 3) {
            searchStats.innerHTML = currentLang === 'ru' ? '✏️ Введите минимум 3 символа' : '✏️ Enter at least 3 characters';
            if (noResultsDiv) noResultsDiv.style.display = 'none';
            resetSearchHighlightAndExpand();
            return;
        }
        
        let totalMatches = 0;
        const categories = document.querySelectorAll('.category-card');
        const lowerQuery = query.toLowerCase();
        
        categories.forEach(category => {
            const itemsDiv = category.querySelector('.items-grid');
            const itemRows = itemsDiv.querySelectorAll('.item-row');
            let hasMatchInCategory = false;
            
            itemRows.forEach(row => {
                const labelEl = row.querySelector('label');
                const originalText = labelEl.getAttribute('data-original-text');
                const itemName = originalText || labelEl.innerText;
                if (!labelEl.getAttribute('data-original-text')) {
                    labelEl.setAttribute('data-original-text', itemName);
                }
                const matches = itemName.toLowerCase().includes(lowerQuery);
                if (matches) {
                    hasMatchInCategory = true;
                    totalMatches++;
                    row.style.display = '';
                    const highlighted = highlightText(itemName, query);
                    labelEl.innerHTML = highlighted;
                } else {
                    row.style.display = 'none';
                    const original = labelEl.getAttribute('data-original-text');
                    if (original) labelEl.innerText = original;
                }
            });
            
            if (hasMatchInCategory) {
                category.style.display = '';
                if (!itemsDiv.classList.contains('active')) {
                    itemsDiv.classList.add('active');
                    const toggleIcon = category.querySelector('.toggle-icon');
                    if (toggleIcon) toggleIcon.textContent = '▼';
                }
            } else {
                category.style.display = 'none';
            }
        });
        
        if (totalMatches === 0) {
            const noMsg = currentLang === 'ru' ? `😕 Ничего не найдено по запросу "${query}"` : `😕 No matches found for "${query}"`;
            if (noResultsDiv) {
                noResultsDiv.innerHTML = noMsg;
                noResultsDiv.style.display = 'block';
            }
            searchStats.innerHTML = ` 0 ${currentLang === 'ru' ? '' : 'matches'}`;
        } else {
            if (noResultsDiv) noResultsDiv.style.display = 'none';
            searchStats.innerHTML = ` ${totalMatches} ${currentLang === 'ru' ? '' : 'matches'}`;
        }
    }
    
    function resetSearchHighlightAndExpand() {
        const searchStats = document.getElementById('searchStats');
        const noResultsDiv = document.getElementById('noResultsMessage');
        if (searchStats) searchStats.innerHTML = '';
        if (noResultsDiv) noResultsDiv.style.display = 'none';
        
        const categories = document.querySelectorAll('.category-card');
        categories.forEach(category => {
            category.style.display = '';
            const itemsDiv = category.querySelector('.items-grid');
            const itemRows = itemsDiv.querySelectorAll('.item-row');
            itemRows.forEach(row => {
                row.style.display = '';
                const labelEl = row.querySelector('label');
                const original = labelEl.getAttribute('data-original-text');
                if (original) {
                    labelEl.innerText = original;
                }
            });
            if (itemsDiv.classList.contains('active')) {
                itemsDiv.classList.remove('active');
                const toggleIcon = category.querySelector('.toggle-icon');
                if (toggleIcon) toggleIcon.textContent = '▶';
            }
        });
    }
    
    let searchTimeout;
    function onSearchInput() {
        if (searchTimeout) clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            applySearchAndHighlight();
        }, 200);
    }
    
    function clearSearch() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.value = '';
            applySearchAndHighlight();
        }
    }

    function buildUI() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        
        categoriesConfig.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-card';
            
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerHTML = `
                <div class="category-title">📂 ${cat.name}</div>
                <div class="category-controls">
                    <span class="toggle-icon">▶</span>
                    <input type="checkbox" class="category-checkbox">
                </div>
            `;
            
            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'items-grid';
            
            cat.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <input type="checkbox" data-name="${item.replace(/"/g, '&quot;')}" onchange="checkDatabase()">
                    <label>${item}</label>
                `;
                itemsDiv.appendChild(row);
            });
            
            card.appendChild(header);
            card.appendChild(itemsDiv);
            container.appendChild(card);
            
            const toggleIcon = header.querySelector('.toggle-icon');
            const groupCheckbox = header.querySelector('.category-checkbox');
            const childCheckboxes = itemsDiv.querySelectorAll('input[type="checkbox"]');
            
            header.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') return;
                itemsDiv.classList.toggle('active');
                toggleIcon.textContent = itemsDiv.classList.contains('active') ? '▼' : '▶';
            });
            
            groupCheckbox.addEventListener('change', () => {
                childCheckboxes.forEach(cb => cb.checked = groupCheckbox.checked);
                window.checkDatabase();
            });
            
            childCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const allChecked = Array.from(childCheckboxes).every(c => c.checked);
                    groupCheckbox.checked = allChecked;
                    window.checkDatabase();
                });
            });
            
            itemsDiv.classList.remove('active');
            toggleIcon.textContent = '▶';
        });
    }
    
    document.getElementById('selectAllBtn')?.addEventListener('click', () => {
        const allBoxes = document.querySelectorAll('.item-row input[type="checkbox"]');
        const allChecked = Array.from(allBoxes).every(cb => cb.checked);
        allBoxes.forEach(cb => cb.checked = !allChecked);
        document.querySelectorAll('.category-checkbox').forEach(gc => gc.checked = !allChecked);
        window.checkDatabase();
    });
    
    function initSearch() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        if (searchInput) {
            searchInput.addEventListener('input', onSearchInput);
            searchInput.placeholder = translations[currentLang].search_placeholder;
        }
        if (clearBtn) {
            clearBtn.addEventListener('click', clearSearch);
        }
    }
    
    buildUI();
    initSearch();
    window.checkDatabase();
</script>
</body>
</html>
