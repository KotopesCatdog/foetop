                        // Остальные числовые колонки
                        cell.className = 'number-cell';
                    }
                    
                    // Проверяем значение и скрываем если это "0"
const cellValue = row[i];
if (cellValue === "0" || cellValue === 0) {
    cell.textContent = ""; // Делаем пустым
    cell.style.color = "transparent"; // Или делаем прозрачным
} else {
    cell.textContent = cellValue;
}
                    tr.appendChild(cell);
                }
                
                tableBody.appendChild(tr);
            });
            
            // Обновляем счетчик строк
            document.getElementById('rowCount').textContent = filteredData.length;
        }

        // Функция сортировки
        function sortTable(columnIndex) {
            // Если кликаем на ту же колонку, меняем направление
            if (currentSortColumn === columnIndex) {
                sortDirection *= -1;
            } else {
                // Иначе сортируем по возрастанию
                currentSortColumn = columnIndex;
                sortDirection = 1;
            }
            
            // Сбрасываем классы сортировки у всех заголовков
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            
            // Добавляем класс сортировки к текущему заголовку
            const currentHeader = document.querySelector(`th[data-column="${columnIndex}"]`);
            if (currentHeader) {
                currentHeader.classList.add(sortDirection === 1 ? 'sort-asc' : 'sort-desc');
            }
            
            // СОРТИРОВКА: сортируем ВСЕ строки на основе значения в выбранном столбце
            filteredData.sort((a, b) => {
                
                
                // В функции sortTable, внутри сортировки, после строк let valA = a[columnIndex];
// Замените блок обработки значений на:

let valA = a[columnIndex];
let valB = b[columnIndex];

// СПЕЦИАЛЬНАЯ ОБРАБОТКА ДЛЯ КОЛОНКИ "РАЗМЕР" (индекс 1)
if (columnIndex === 1 && valA && valB) {
    // Разделяем размеры на два числа: "3x4" -> [3, 4]
    const parseSize = (sizeStr) => {
        const parts = sizeStr.split(/[x×]/); // поддерживаем оба символа: x и ×
        if (parts.length === 2) {
            return {
                width: parseInt(parts[0]) || 0,
                height: parseInt(parts[1]) || 0
            };
        }
        return { width: 0, height: 0 };
    };
    
    const sizeA = parseSize(valA);
    const sizeB = parseSize(valB);
    
    // Сначала сортируем по ширине, затем по высоте
    if (sizeA.width !== sizeB.width) {
        return (sizeA.width - sizeB.width) * sortDirection;
    }
    return (sizeA.height - sizeB.height) * sortDirection;
}

// Остальная логика сортировки для остальных колонок
const numA = parseFloat(valA);
const numB = parseFloat(valB);

// Если оба значения можно преобразовать в числа, сравниваем как числа
if (!isNaN(numA) && !isNaN(numB) && valA !== "" && valB !== "") {
    valA = numA;
    valB = numB;
} else {
    // Иначе сравниваем как строки
    valA = String(valA || '').toLowerCase();
    valB = String(valB || '').toLowerCase();
}

// Сравниваем значения
if (valA < valB) return -1 * sortDirection;
if (valA > valB) return 1 * sortDirection;
return 0;
                
                
                
                
            });
            
            // Обновляем таблицу
            initTable();
            
            // Обновляем информацию о сортировке
            updateSortInfo(columnIndex);
        }

        // Обновление информации о сортировке
        function updateSortInfo(columnIndex) {
            const headers = [
                "Здание", "Размер", "Требует дорог", "СО", "Товары", "Товары пред. эпохи", "Товары в гильдию", "Юниты", "Молотки", "Чертежи", "Народ", "Кр. Атака", "Кр. Защита", "Син. Атака", "Син. Защита", "Кр. Атака Поля", "Кр. Защита Поля", "Син. Атака Поля", "Син. Защита Поля", "Кр. Атака Экспа", "Кр. Защита Экспа", "Син. Атака Экспа", "Син. Защита Экспа"
            ];
            
            const directionText = sortDirection === 1 ? "по возрастанию" : "по убыванию";
            document.getElementById('sortStatus').textContent = 
                `Сортировка: ${headers[columnIndex]} (${directionText})`;
        }

        // Функция поиска
        function searchTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm === '') {
                filteredData = [...excelData];
            } else {
                filteredData = excelData.filter(row => {
                    // Ищем во всех колонках
                    return row.some(cell => 
                        cell.toString().toLowerCase().includes(searchTerm)
                    );
                });
            }
            
            // Сбрасываем сортировку при поиске
            currentSortColumn = -1;
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            document.getElementById('sortStatus').textContent = "Сортировка: Нет";
            
            initTable();
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            initTable();
            
            // Добавляем обработчики событий для заголовков
            document.querySelectorAll('th[data-column]').forEach(th => {
                th.addEventListener('click', () => {
                    const columnIndex = parseInt(th.getAttribute('data-column'));
                    sortTable(columnIndex);
                });
            });
            
            // Добавляем обработчик для поиска
            document.getElementById('searchInput').addEventListener('input', searchTable);
            
            // Тест сортировки: сортируем по умолчанию по названию здания
            sortTable(0);
        });
    </script>
</body>
