<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Puzznic - Головоломка</title>
     <link rel="icon" href="https://foehelp.ru/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div class="game-container">
        <div class="game-screen">
            <canvas id="gameCanvas" width="900" height="650"></canvas>
            
            <div class="ui-overlay">
                <div class="score-panel">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="scoreValue">0</div>
                </div>
                
                <div class="level-panel">
                    <div class="level-label">LEVEL</div>
                    <div class="level-value" id="levelValue">1</div>
                </div>
                
                <div class="counters-panel" id="countersPanel">
                    <!-- Счётчики блоков будут добавлены динамически -->
                </div>
            </div>
        </div>
        
        <div class="controls-bar">
    <span class="level-label">Уровень</span>
    <select id="levelSelect" class="level-select" onchange="game.loadLevelFromSelect()">
    </select>
    <button onclick="game.resetLevel()" class="reset-btn">🔄 Сброс</button>
    <button id="themeBtn" class="theme-btn">Тема</button>
</div>
        
        
      
        <div class="instructions">
            <div class="ctrl-hint">← → ↑ ↓</div>
            <div>Движение курсора</div>
            
            <div class="ctrl-hint">Ctrl</div>
            <div>Автовыбор блоков</div>
            <div class="ctrl-hint">Space</div>
            <div>Взять блок</div>
            
            
            <div class="reset-hint">R</div>
            <div>Перезапустить уровень</div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div id="victoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🏆</div>
            <div class="modal-title">УРОВЕНЬ ПРОЙДЕН!</div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-stats" id="modalStats"></div>
            <button class="modal-btn" id="nextLevelBtn">ДАЛЕЕ → Ctrl</button>
        </div>
    </div>
    
    <script src="js/audio.js"></script>
    <script src="levels/levels.js"></script>
    <script src="js/level.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script>
    // Обработчик кнопки смены темы
    document.getElementById('themeBtn').addEventListener('click', () => {
        if (game && typeof game.switchTheme === 'function') {
            game.switchTheme();
        } else {
            console.log("Игра ещё не загружена или switchTheme не определён");
        }
    });
</script>
</body>
</html>
