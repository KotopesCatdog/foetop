<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор карт и провинций</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header>
    <h1>✏️ Редактор карт и провинций</h1>
    <div class="header-actions">
      <a href="index.html" class="btn">⬅️ На карту</a>
      <button id="saveData" class="btn btn-primary">💾 Сохранить всё</button>
      <button id="exportData" class="btn">📥 Экспорт</button>
      <button id="importData" class="btn">📤 Импорт</button>
    </div>
  </header>

  <div class="editor-container">
    <!-- Левая часть: КАРТА -->
    <div class="editor-map-wrapper">
      <div class="map-container">
        <img id="editorMap" src="" alt="Карта" style="width: 100%; height: 100%; object-fit: contain; display: none;">
        <canvas id="editorCanvas"></canvas>
        <div id="editorTooltip" class="tooltip hidden"></div>
        <div id="editorLoading" class="loading-message">
          <span>🖼️</span>
          <p>Выберите или создайте карту</p>
        </div>
      </div>
      <div class="editor-status">
        <span id="editStatus">Режим: просмотр</span>
        <span id="coordDisplay">X: 0, Y: 0</span>
        <span id="provinceCountDisplay">Провинций: 0</span>
      </div>
    </div>

    <!-- Правая панель: ВСЕ НАСТРОЙКИ -->
    <div class="editor-sidebar">
      <!-- Список карт -->
      <div class="panel panel-maps">
        <div class="panel-header">
          <h3>📚 Карты</h3>
          <button id="addMapBtn" class="btn btn-primary btn-sm">➕</button>
        </div>
        <ul id="mapsList"></ul>
      </div>

      <!-- Редактор карты -->
      <div class="panel panel-map-editor">
        <div class="panel-header">
          <h3>🗺️ Редактор карты</h3>
        </div>
        <form id="mapForm" class="compact-form">
          <div class="form-row">
            <div class="form-group">
              <label>ID</label>
              <input type="text" id="mapIdInput" required placeholder="old_ages">
            </div>
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="mapNameInput" required placeholder="Старые Земли">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Эпоха</label>
              <input type="text" id="mapEraInput" required placeholder="Древняя эпоха">
            </div>
            <div class="form-group">
              <label>Путь к картинке</label>
              <input type="text" id="mapImageInput" required placeholder="data/Map.webp">
            </div>
          </div>
          <div class="form-group">
            <label>Описание</label>
            <input type="text" id="mapDescriptionInput" placeholder="Описание карты...">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-sm">💾 Сохранить</button>
            <button type="button" id="deleteMapBtn" class="btn btn-danger btn-sm">🗑️</button>
          </div>
        </form>
      </div>

      <!-- Редактор провинций -->
      <div class="panel panel-province-editor">
        <div class="panel-header">
          <h3>📍 Провинции</h3>
          <span id="provinceCountSmall">0</span>
        </div>
        
        <form id="provinceForm" class="compact-form">
          <div class="form-row">
            <div class="form-group">
              <label>Название *</label>
              <input type="text" id="provName" required placeholder="Название провинции">
            </div>
            <div class="form-group">
              <label>Эмодзи</label>
              <select id="provEmoji" class="emoji-select">
                <option value="">Без эмодзи</option>
                <option value="💎">💎</option>
                <option value="💢">💢</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Координаты</label>
              <div class="coord-inputs">
                <input type="number" id="provX" placeholder="X" readonly>
                <input type="number" id="provY" placeholder="Y" readonly>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-sm">➕ Добавить</button>
            <button type="reset" class="btn btn-sm">Очистить</button>
            <button type="button" id="cancelProvinceEdit" class="btn btn-sm" style="display:none;">Отменить</button>
          </div>
        </form>

        <div class="province-search">
          <input type="text" id="provSearch" placeholder="🔍 Поиск провинции...">
        </div>
        <ul id="provinceList"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
