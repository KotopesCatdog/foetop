<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOEhelp</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        background-color: black;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        box-sizing: border-box;
        transition: background-image 1s ease-in-out;
    }
        .menu-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 80%;
    max-width: 400px;
    padding: 40px;
    background-color: rgba(0, 0, 0, 0.7);
    border: 4px solid #008080;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
}
        .menu-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background-color: #008080;
    border: 4px solid black;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    text-align: center;
    text-decoration: none;
    transition: all 0.3s;
}
        .menu-btn:hover {
            background-color: #00a0a0;
            box-shadow: 0 0 25px rgba(0, 255, 255, 1);
            transform: scale(1.05);
        }
        .title {
    text-align: center;
    font-size: 36px;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff;
    margin-bottom: 20px;
    font-family: 'Courier New', monospace;
}
        .under-construction {
            width: 100%;
            max-width: 400px;
            margin: 40px auto 0;
            display: block;
        }
        .footer-text {
            margin-top: 0px;
            text-align: center;
            font-size: 14px;
            color: #888;
            line-height: 1.4;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .lang-switcher button {
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
            background: transparent;
            border: 2px solid #008080;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-switcher button:hover,
        .lang-switcher button.active {
            background: #008080;
            color: white;
        }
        
        body {
            transition: background-image 1s ease-in-out;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    
    <div class="menu-container">
        <a href="/events/" target="_self" class="menu-btn" data-i18n="index_btn_events">Ивенты</a>
        <a href="/kva/" target="_self" class="menu-btn" data-i18n="index_btn_quanta">Кванты</a>
        <a href="/param/" target="_self" class="menu-btn" data-i18n="index_btn_params">Параметры</a>  
        <a href="/calk/" target="_self" class="menu-btn" data-i18n="index_btn_calc">Калькуляторы</a>  
        <a href="/redaktor/" target="_self" class="menu-btn" data-i18n="index_btn_editors">Редакторы</a>
        <a href="/links/" target="_self" class="menu-btn" data-i18n="index_btn_links">Полезные ссылки</a>
        <a href="/game/" target="_self" class="menu-btn" data-i18n="index_btn_games">Games</a>
        <a href="https://t.me/foehelp" target="_blank" class="menu-btn" data-i18n="index_btn_questions">Вопросы, предложения...</a>

        <div style="text-align: center; margin-top: 30px;"></div>

        <div class="lang-switcher">
            <button data-lang-btn="ru" onclick="i18nSwitchTo('ru')">RU</button>
            <button data-lang-btn="en" onclick="i18nSwitchTo('en')">EN</button>
        </div>

        <div class="footer-text" style="color: #ffffff;">
    © 2026 KotoPes <br> 
     <a href="privacy.html" 
       target="_blank" 
       style="color: #00ddff; text-decoration: none;" data-i18n="common_footer_privacy">
       Privacy Policy
     </a>
</div>
    </div>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script>
const helpWrapper = document.createElement('div');
    helpWrapper.id = 'helpWidgetWrapper';
    helpWrapper.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
    `;
    const helpBtn = document.createElement('button');
    helpBtn.dataset.i18n = 'common_help_btn';
    helpBtn.textContent = 'Помощь проекту';
    helpBtn.style.cssText = `
        width: 130px;
        padding: 12px 0;
        background: #e91e63;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 4px 16px rgba(233,30,99,0.4);
        transition: all 0.3s;
        font-family: inherit;
    `;
    helpBtn.addEventListener('mouseover', () => helpBtn.style.transform = 'scale(1.08)');
    helpBtn.addEventListener('mouseout', () => helpBtn.style.transform = 'scale(1)');

    const helpWindow = document.createElement('div');
    helpWindow.id = 'helpProjectWindow';
    helpWindow.style.cssText = `
        display: none;
        position: fixed;
        top: 80px;
        right: 20px;
        background: linear-gradient(135deg, rgba(30,20,40,0.95), rgba(15,10,25,0.98));
        backdrop-filter: blur(8px);
        border: 3px solid #ff66c0;
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(255,102,192,0.6);
        width: 300px;
        min-height: 280px;
        z-index: 10001;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
    `;
    const windowHeader = document.createElement('div');
    windowHeader.style.cssText = `
        background: linear-gradient(135deg, #b83b5e, #6a1b3a);
        color: white;
        padding: 14px 18px;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
        user-select: none;
        border-bottom: 2px solid #ff99cc;
    `;
    const headerTitle = document.createElement('span');
    headerTitle.dataset.i18n = 'common_help_title';
    headerTitle.innerHTML = '❤️ Поддержка проекта';
    const closeBtnHelp = document.createElement('button');
    closeBtnHelp.textContent = '✕';
    closeBtnHelp.style.cssText = `
        background: none;
        border: none;
        color: #ffb347;
        font-size: 28px;
        cursor: pointer;
        padding: 0 8px;
        font-weight: bold;
        transition: all 0.2s;
    `;
    closeBtnHelp.addEventListener('mouseover', () => {
        closeBtnHelp.style.transform = 'scale(1.2)';
        closeBtnHelp.style.color = '#fff';
    });
    closeBtnHelp.addEventListener('mouseout', () => {
        closeBtnHelp.style.transform = 'scale(1)';
        closeBtnHelp.style.color = '#ffb347';
    });
    windowHeader.appendChild(headerTitle);
    windowHeader.appendChild(closeBtnHelp);
    const windowContent = document.createElement('div');
    windowContent.style.cssText = `
        padding: 30px 25px;
        text-align: center;
        color: #f0e6ff;
    `;
    const iconDiv = document.createElement('div');
    iconDiv.innerHTML = '🐱✨🐶';
    iconDiv.style.cssText = `
        font-size: 48px;
        margin-bottom: 15px;
        opacity: 0.9;
    `;
    const descText = document.createElement('p');
    descText.dataset.i18n = 'common_help_desc';
    descText.textContent = 'Если вам нравится проект — поддержите его развитие!';
    descText.style.cssText = `
        margin: 0 0 20px 0;
        font-size: 15px;
        line-height: 1.4;
        color: #ddd0ff;
    `;
    const donateBtn = document.createElement('button');
    donateBtn.dataset.i18n = 'common_help_donate_btn';
    donateBtn.textContent = 'Помощь проекту';
    donateBtn.style.cssText = `
        padding: 14px 28px;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 60px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(255,71,87,0.4);
        margin-top: 8px;
        width: 100%;
        font-family: inherit;
    `;
    donateBtn.addEventListener('mouseover', () => {
        donateBtn.style.transform = 'scale(1.02)';
        donateBtn.style.background = '#ff6b81';
        donateBtn.style.boxShadow = '0 6px 18px rgba(255,71,87,0.6)';
    });
    donateBtn.addEventListener('mouseout', () => {
        donateBtn.style.transform = 'scale(1)';
        donateBtn.style.background = '#ff4757';
        donateBtn.style.boxShadow = '0 4px 12px rgba(255,71,87,0.4)';
    });
    donateBtn.addEventListener('click', () => {
        window.open('https://boosty.to/foehelp/donate', '_blank', 'noopener,noreferrer');
    });
    windowContent.appendChild(iconDiv);
    windowContent.appendChild(descText);
    windowContent.appendChild(donateBtn);
    helpWindow.appendChild(windowHeader);
    helpWindow.appendChild(windowContent);
    helpWrapper.appendChild(helpBtn);
    document.body.appendChild(helpWrapper);
    document.body.appendChild(helpWindow);

    let isDraggingHelp = false;
    let dragOffsetXHelp = 0, dragOffsetYHelp = 0;
    windowHeader.addEventListener('mousedown', (e) => {
        if (e.target === closeBtnHelp) return;
        isDraggingHelp = true;
        const rect = helpWindow.getBoundingClientRect();
        dragOffsetXHelp = e.clientX - rect.left;
        dragOffsetYHelp = e.clientY - rect.top;
        helpWindow.style.cursor = 'grabbing';
        helpWindow.style.top = rect.top + 'px';
        helpWindow.style.right = 'auto';
        helpWindow.style.left = rect.left + 'px';
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDraggingHelp) return;
        let newLeft = e.clientX - dragOffsetXHelp;
        let newTop = e.clientY - dragOffsetYHelp;
        const maxX = window.innerWidth - helpWindow.offsetWidth;
        const maxY = window.innerHeight - helpWindow.offsetHeight;
        newLeft = Math.max(0, Math.min(newLeft, maxX));
        newTop = Math.max(0, Math.min(newTop, maxY));
        helpWindow.style.left = newLeft + 'px';
        helpWindow.style.top = newTop + 'px';
        helpWindow.style.right = 'auto';
    });
    document.addEventListener('mouseup', () => {
        if (isDraggingHelp) {
            isDraggingHelp = false;
            helpWindow.style.cursor = 'default';
        }
    });
    helpBtn.addEventListener('click', () => {
        helpBtn.style.display = 'none';
        helpWindow.style.display = 'block';
        if (!helpWindow.hasAttribute('data-dragged')) {
            helpWindow.style.top = '80px';
            helpWindow.style.right = '20px';
            helpWindow.style.left = 'auto';
            helpWindow.style.bottom = 'auto';
        }
    });
    closeBtnHelp.addEventListener('click', () => {
        helpWindow.style.display = 'none';
        helpBtn.style.display = 'block';
    });
    windowHeader.addEventListener('mousedown', () => {
        helpWindow.setAttribute('data-dragged', 'true');
    });
    window.addEventListener('resize', () => {
        if (helpWindow.style.display === 'block') {
            const maxX = window.innerWidth - helpWindow.offsetWidth;
            const maxY = window.innerHeight - helpWindow.offsetHeight;
            let left = parseFloat(helpWindow.style.left);
            let top = parseFloat(helpWindow.style.top);
            if (!isNaN(left) && !isNaN(top)) {
                left = Math.max(0, Math.min(left, maxX));
                top = Math.max(0, Math.min(top, maxY));
                helpWindow.style.left = left + 'px';
                helpWindow.style.top = top + 'px';
            }
        }
    });
</script>

<script src="/js/i18n.js"></script>
<script src="/game/krak/js/background2.js"></script>
<link rel="stylesheet" href="/game/krak/js/radio-widget.css">
<script src="/game/krak/js/radio-widget.js"></script>
    
</body>
</html>
