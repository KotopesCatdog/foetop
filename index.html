<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOEhelp</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        /* Базовые настройки сцены */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: background-image 1s ease-in-out;
            position: relative;
            z-index: 1;
        }

        /* === Падающие звёзды (адаптация из popup) === */
        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
            animation: flyStar linear infinite;
            box-shadow: 0 0 6px rgba(255, 255, 200, 0.8);
        }

        @keyframes flyStar {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh) translateX(var(--drift, 30px));
                opacity: 0;
            }
        }

        /* Заголовок-вывеска с неоновым мерцанием */
        .title {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #008080;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            animation: neonBlink 3s infinite alternate;
        }

        @keyframes neonBlink {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #008080; }
            92% { opacity: 1; }
            93% { opacity: 0.8; text-shadow: 0 0 5px #00ffff, 0 0 10px #008080; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            97% { opacity: 1; }
        }

        /* Главный контейнер (Эффект матового стекла / Glassmorphism) */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(7, 15, 35, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(0, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(0, 128, 128, 0.2),
                        inset 0 0 20px rgba(0, 255, 255, 0.1);
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        /* Кнопки будущего — Киберпанк стиль */
        .menu-btn {
            position: relative;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e2f1f1;
            background: linear-gradient(135deg, rgba(0, 128, 128, 0.7) 0%, rgba(0, 70, 80, 0.8) 100%);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Эффект глянцевого блеска при наведении */
        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        .menu-btn:hover::before {
            left: 150%;
        }

        .menu-btn:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #00a0a0 0%, #007070 100%);
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 0 8px rgba(255,255,255,0.3);
            transform: translateY(-3px) scale(1.02);
        }

        .menu-btn:active {
            transform: translateY(-1px) scale(1);
        }

        /* Кнопка Telegram (Особый акцент) */
        .menu-btn[data-i18n="index_btn_questions"] {
            background: linear-gradient(135deg, rgba(26, 145, 218, 0.7) 0%, rgba(15, 80, 120, 0.8) 100%);
            border-color: rgba(29, 161, 242, 0.5);
        }
        .menu-btn[data-i18n="index_btn_questions"]:hover {
            background: linear-gradient(135deg, #1da1f2 0%, #1070aa 100%);
            border-color: #1da1f2;
            box-shadow: 0 0 25px rgba(29, 161, 242, 0.6);
        }

        /* Переключатель языков */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .lang-switcher button {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #00ffff;
            background: rgba(0, 30, 40, 0.5);
            border: 1px solid rgba(0, 128, 128, 0.5);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-switcher button:hover,
        .lang-switcher button.active {
            background: #008080;
            color: white;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        /* Футер */
        .footer-text {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #7a8a99;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .footer-text a {
            color: #00ddff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #00ddff;
        }
        
        /* адаптивность поля звёзд */
        @media (max-width: 600px) {
            .menu-container {
                padding: 28px 20px;
            }
            .title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

        <a href="/kva/" target="_self" class="menu-btn" data-i18n="index_btn_quanta">Кванты</a>
        <a href="/param/" target="_self" class="menu-btn" data-i18n="index_btn_params">Параметры</a>  
        <a href="/calk/" target="_self" class="menu-btn" data-i18n="index_btn_calc">Калькуляторы</a>  
        <a href="/redaktor/cityplan.html" target="_blank" class="menu-btn" data-i18n="index_btn_editors">Редактор города</a>
        <a href="/links/" target="_self" class="menu-btn" data-i18n="index_btn_links">Полезные ссылки</a>
        <a href="/game/" target="_self" class="menu-btn" data-i18n="index_btn_games">Games</a>
        
       <a href="#" id="installDbBtn" class="menu-btn">FOEhelp</a>
        
        <a href="https://t.me/foehelp" target="_blank" class="menu-btn" data-i18n="index_btn_questions">Вопросы, предложения...</a>

        <div class="lang-switcher">
            <button data-lang-btn="ru" onclick="i18nSwitchTo('ru')">RU</button>
            <button data-lang-btn="en" onclick="i18nSwitchTo('en')">EN</button>
        </div>

        <div class="footer-text">
            © 2026 KotoPes <br> 
            <a href="privacy.html" target="_blank" data-i18n="common_footer_privacy">
               Privacy Policy
            </a>
        </div>
    </div>
  
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script>
        
        (function initStarfall() {
            const starField = document.getElementById('starField');
            if (!starField) return;
            
            const STARS_COUNT = 85;
            const MIN_SIZE = 1.5;
            const MAX_SIZE = 3.8;
            const MIN_DURATION = 5;
            const MAX_DURATION = 12;
            const MIN_DRIFT = -35;
            const MAX_DRIFT = 70;
            
            const colors = ['#ffffff', '#fff9e6', '#ffe6c7', '#c7e6ff', '#f0f0ff'];
            let activeStars = [];
            function createStar() {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = MIN_SIZE + Math.random() * (MAX_SIZE - MIN_SIZE);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                const color = colors[Math.floor(Math.random() * colors.length)];
                star.style.backgroundColor = color;
                star.style.boxShadow = `0 0 ${size * 1.5}px ${color}`;
                const startPosX = Math.random() * 100;
                star.style.left = startPosX + '%';
                star.style.top = '-5px';
                const drift = MIN_DRIFT + Math.random() * (MAX_DRIFT - MIN_DRIFT);
                star.style.setProperty('--drift', drift + 'px');
                const duration = MIN_DURATION + Math.random() * (MAX_DURATION - MIN_DURATION);
                star.style.animationDuration = duration + 's';
                const delay = Math.random() * 5;
                star.style.animationDelay = delay + 's';
                starField.appendChild(star);
                activeStars.push(star);
                star.addEventListener('animationend', () => {
                    if (star.parentNode) star.remove();
                    const index = activeStars.indexOf(star);
                    if (index !== -1) activeStars.splice(index, 1);
                    if (activeStars.length < STARS_COUNT + 5) {
                        createStar();
                    }
                });
            }
            
            for (let i = 0; i < STARS_COUNT; i++) {
                createStar();
            }
            
            setInterval(() => {
                const currentCount = document.querySelectorAll('.star').length;
                if (currentCount < STARS_COUNT - 5) {
                    const need = STARS_COUNT - currentCount;
                    for (let i = 0; i < Math.min(need, 7); i++) {
                        createStar();
                    }
                }
            }, 8000);
        })();
        
        // Help widget
        (function initHelpWidget() {
            const helpWrapper = document.createElement('div');
            helpWrapper.id = 'helpWidgetWrapper';
            helpWrapper.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: flex-end;
            `;
            const helpBtn = document.createElement('button');
            helpBtn.dataset.i18n = 'common_help_btn';
            helpBtn.textContent = 'Помощь проекту';
            helpBtn.style.cssText = `
                width: 130px;
                padding: 12px 0;
                background: #e91e63;
                color: white;
                border: none;
                border-radius: 50px;
                cursor: pointer;
                font-size: 16px;
                font-weight: bold;
                box-shadow: 0 4px 16px rgba(233,30,99,0.4);
                transition: all 0.3s;
                font-family: inherit;
            `;
            helpBtn.addEventListener('mouseover', () => helpBtn.style.transform = 'scale(1.08)');
            helpBtn.addEventListener('mouseout', () => helpBtn.style.transform = 'scale(1)');

            const helpWindow = document.createElement('div');
            helpWindow.id = 'helpProjectWindow';
            helpWindow.style.cssText = `
                display: none;
                position: fixed;
                top: 80px;
                right: 20px;
                background: linear-gradient(135deg, rgba(30,20,40,0.95), rgba(15,10,25,0.98));
                backdrop-filter: blur(8px);
                border: 3px solid #ff66c0;
                border-radius: 20px;
                box-shadow: 0 0 30px rgba(255,102,192,0.6);
                width: 300px;
                min-height: 280px;
                z-index: 10001;
                overflow: hidden;
                font-family: 'Segoe UI', system-ui, sans-serif;
            `;
            const windowHeader = document.createElement('div');
            windowHeader.style.cssText = `
                background: linear-gradient(135deg, #b83b5e, #6a1b3a);
                color: white;
                padding: 14px 18px;
                font-size: 18px;
                font-weight: bold;
                display: flex;
                justify-content: space-between;
                align-items: center;
                cursor: move;
                user-select: none;
                border-bottom: 2px solid #ff99cc;
            `;
            const headerTitle = document.createElement('span');
            headerTitle.dataset.i18n = 'common_help_title';
            headerTitle.innerHTML = '❤️ Поддержка проекта';
            const closeBtnHelp = document.createElement('button');
            closeBtnHelp.textContent = '✕';
            closeBtnHelp.style.cssText = `
                background: none;
                border: none;
                color: #ffb347;
                font-size: 28px;
                cursor: pointer;
                padding: 0 8px;
                font-weight: bold;
                transition: all 0.2s;
            `;
            closeBtnHelp.addEventListener('mouseover', () => {
                closeBtnHelp.style.transform = 'scale(1.2)';
                closeBtnHelp.style.color = '#fff';
            });
            closeBtnHelp.addEventListener('mouseout', () => {
                closeBtnHelp.style.transform = 'scale(1)';
                closeBtnHelp.style.color = '#ffb347';
            });
            windowHeader.appendChild(headerTitle);
            windowHeader.appendChild(closeBtnHelp);
            const windowContent = document.createElement('div');
            windowContent.style.cssText = `
                padding: 30px 25px;
                text-align: center;
                color: #f0e6ff;
            `;
            const iconDiv = document.createElement('div');
            iconDiv.innerHTML = '🐱✨🐶';
            iconDiv.style.cssText = `
                font-size: 48px;
                margin-bottom: 15px;
                opacity: 0.9;
            `;
            const descText = document.createElement('p');
            descText.dataset.i18n = 'common_help_desc';
            descText.textContent = 'Если вам нравится проект — поддержите его развитие!';
            descText.style.cssText = `
                margin: 0 0 20px 0;
                font-size: 15px;
                line-height: 1.4;
                color: #ddd0ff;
            `;
            const donateBtn = document.createElement('button');
            donateBtn.dataset.i18n = 'common_help_donate_btn';
            donateBtn.textContent = 'Помощь проекту';
            donateBtn.style.cssText = `
                padding: 14px 28px;
                background: #ff4757;
                color: white;
                border: none;
                border-radius: 60px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s;
                box-shadow: 0 4px 12px rgba(255,71,87,0.4);
                margin-top: 8px;
                width: 100%;
                font-family: inherit;
            `;
            donateBtn.addEventListener('mouseover', () => {
                donateBtn.style.transform = 'scale(1.02)';
                donateBtn.style.background = '#ff6b81';
                donateBtn.style.boxShadow = '0 6px 18px rgba(255,71,87,0.6)';
            });
            donateBtn.addEventListener('mouseout', () => {
                donateBtn.style.transform = 'scale(1)';
                donateBtn.style.background = '#ff4757';
                donateBtn.style.boxShadow = '0 4px 12px rgba(255,71,87,0.4)';
            });
            donateBtn.addEventListener('click', () => {
                window.open('https://boosty.to/foehelp/donate', '_blank', 'noopener,noreferrer');
            });
            windowContent.appendChild(iconDiv);
            windowContent.appendChild(descText);
            windowContent.appendChild(donateBtn);
            helpWindow.appendChild(windowHeader);
            helpWindow.appendChild(windowContent);
            helpWrapper.appendChild(helpBtn);
            document.body.appendChild(helpWrapper);
            document.body.appendChild(helpWindow);

            let isDraggingHelp = false;
            let dragOffsetXHelp = 0, dragOffsetYHelp = 0;
            windowHeader.addEventListener('mousedown', (e) => {
                if (e.target === closeBtnHelp) return;
                isDraggingHelp = true;
                const rect = helpWindow.getBoundingClientRect();
                dragOffsetXHelp = e.clientX - rect.left;
                dragOffsetYHelp = e.clientY - rect.top;
                helpWindow.style.cursor = 'grabbing';
                helpWindow.style.top = rect.top + 'px';
                helpWindow.style.right = 'auto';
                helpWindow.style.left = rect.left + 'px';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDraggingHelp) return;
                let newLeft = e.clientX - dragOffsetXHelp;
                let newTop = e.clientY - dragOffsetYHelp;
                const maxX = window.innerWidth - helpWindow.offsetWidth;
                const maxY = window.innerHeight - helpWindow.offsetHeight;
                newLeft = Math.max(0, Math.min(newLeft, maxX));
                newTop = Math.max(0, Math.min(newTop, maxY));
                helpWindow.style.left = newLeft + 'px';
                helpWindow.style.top = newTop + 'px';
                helpWindow.style.right = 'auto';
            });
            document.addEventListener('mouseup', () => {
                if (isDraggingHelp) {
                    isDraggingHelp = false;
                    helpWindow.style.cursor = 'default';
                }
            });
            helpBtn.addEventListener('click', () => {
                helpBtn.style.display = 'none';
                helpWindow.style.display = 'block';
                if (!helpWindow.hasAttribute('data-dragged')) {
                    helpWindow.style.top = '80px';
                    helpWindow.style.right = '20px';
                    helpWindow.style.left = 'auto';
                    helpWindow.style.bottom = 'auto';
                }
            });
            closeBtnHelp.addEventListener('click', () => {
                helpWindow.style.display = 'none';
                helpBtn.style.display = 'block';
            });
            windowHeader.addEventListener('mousedown', () => {
                helpWindow.setAttribute('data-dragged', 'true');
            });
            window.addEventListener('resize', () => {
                if (helpWindow.style.display === 'block') {
                    const maxX = window.innerWidth - helpWindow.offsetWidth;
                    const maxY = window.innerHeight - helpWindow.offsetHeight;
                    let left = parseFloat(helpWindow.style.left);
                    let top = parseFloat(helpWindow.style.top);
                    if (!isNaN(left) && !isNaN(top)) {
                        left = Math.max(0, Math.min(left, maxX));
                        top = Math.max(0, Math.min(top, maxY));
                        helpWindow.style.left = left + 'px';
                        helpWindow.style.top = top + 'px';
                    }
                }
            });
        })();
        
    </script>
    
    <script src="/js/i18n.js"></script>

    <script>
        (function initDatabaseInstall() {
            const installBtn = document.getElementById('installDbBtn');
            if (!installBtn) return;
            
            async function loadVersion() {
                try {
                    const response = await fetch('/links-db.json');
                    const data = await response.json();
                    if (data.version) {
                        installBtn.textContent = `FOEhelp v${data.version}`;
                    }
                    installBtn.dataset.url = data.chrome_extension;
                } catch (error) {
                    console.error('Ошибка загрузки версии:', error);
                    installBtn.textContent = 'FOEhelp';
                }
            }
            
            installBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const url = installBtn.dataset.url;
                if (url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                } else {
                    try {
                        const response = await fetch('/links-db.json');
                        const data = await response.json();
                        window.open(data.chrome_extension, '_blank', 'noopener,noreferrer');
                    } catch (error) {
                        console.error('Ошибка:', error);
                    }
                }
            });
            
            loadVersion();
        })();
    </script>
