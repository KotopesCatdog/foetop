<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ивенты</title>
    <link rel="icon" href="https://foehelp.ru/favicon.png" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            background-color: black;
        }
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .menu-container {
            position: relative; /* Важно для позиционирования тултипа */
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 500px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 4px solid #008080;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
        }
        .menu-btn {
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #008080;
            border: 4px solid black;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
        }
        .menu-btn:hover {
            background-color: #00a0a0;
            box-shadow: 0 0 25px rgba(0, 255, 255, 1);
            transform: scale(1.05);
        }
        .title {
            text-align: center;
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
        }

        /* ==== Тултип с картинкой ==== */
        .tooltip {
            position: absolute;
            pointer-events: none; /* Чтобы не мешал кликам */
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            max-width: 300px;
            border: 3px solid #008080;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
        }
        .tooltip img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h class="title">Ивенты</h>
       
        <a href="//events/dikiy.html"    class="menu-btn" data-image="//events/wild.jpeg">Дикая природа 🦊</a>
        <a href="//events/patrik.html"   class="menu-btn" data-image="//events/patrick.jpeg">Патрик 🍀</a>
        <a href="//events/godov.html"   class="menu-btn" data-image="//events/anniversary.jpeg">Юбилейный 🎉</a>
        <a href="//events/vikings.html" 
        class="menu-btn" data-image="//events/vikings.jpeg">Викинги ⚔️</a>
        <a href="//events/summer.html"
        class="menu-btn" data-image="//events/summer.jpeg">Летний 🌞</a>
        <a href="//events/future.html"
        class="menu-btn" data-image="//events/future.jpeg">Забота о завтрашнем дне 🍻</a>
        <a href="//events/autumn.html"
        class="menu-btn" data-image="//events/autumn.jpeg">Осенний 🍂</a>
        <a href="//events/brotherhood.html"
        class="menu-btn" data-image="//events/brotherhood.jpeg">Братство 🐎</a>
        <a href="//events/halloween.html"
        class="menu-btn" data-image="//events/halloween.jpeg">Хэллоуин 🎃</a>
        <a href="//events/zima.html"    class="menu-btn" data-image="//events/winter.jpeg">Зимний ⛄</a>
        <a href="//sopernik.html" target="_self" class="menu-btn">Соперник 🤪</a>
        <a href="/" class="menu-btn">🏠 Возврат в меню</a>
    </div>

    <!-- Контейнер для картинки-подсказки -->
    <div class="tooltip" id="tooltip">
        <img src="" alt="Preview" id="tooltip-img">
    </div>

    <script>
        const tooltip = document.getElementById('tooltip');
        const tooltipImg = document.getElementById('tooltip-img');
        let timeout;

        document.querySelectorAll('.menu-btn[data-image]').forEach(btn => {
            btn.addEventListener('mouseenter', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    const imgUrl = btn.getAttribute('data-image');
                    tooltipImg.src = imgUrl;

                    // Позиционируем тултип справа от кнопки (можно изменить)
                    const rect = btn.getBoundingClientRect();
                    const containerRect = document.querySelector('.menu-container').getBoundingClientRect();

                    tooltip.style.top = (rect.top - containerRect.top + rect.height / 2 - tooltip.offsetHeight / 2) + 'px';
                    tooltip.style.left = (rect.right - containerRect.left + 20) + 'px'; // 20px отступ от кнопки

                    tooltip.classList.add('visible');
                }, 200); // задержка 500 мс
            });

            btn.addEventListener('mouseleave', () => {
                clearTimeout(timeout);
                tooltip.classList.remove('visible');
            });
        });

        // Скрываем при уходе мыши с области меню (на всякий случай)
        document.querySelector('.menu-container').addEventListener('mouseleave', () => {
            tooltip.classList.remove('visible');
        });
    </script>
    <script src="/game/js/background2.js"></script>
</body>
</html>
