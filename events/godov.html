        /* Контейнер для всего контента (кроме фиксированных кнопок) */

            color: #EFDBA6;

            border-radius: 8px;

        button:hover {
            background-color: #A0522D;
        }
        .output {
            margin-top: 20px;

            border: 2px solid #EFDBA6;
            padding: 15px;

            color: black;
            border-radius: 8px;

            margin-left: auto;
            margin-right: auto;
        }
        .output:empty {
    display: none;
}
        p {

            font-weight: bold;

        }
        /* Кнопка "Назад" */

            left: 15px;

            font-size: 18px;
            font-weight: bold;
            background-color: #8B4513;
            color: #EFDBA6;

            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(239, 219, 166, 0.5);

            transition: all 0.3s;
        }
        .back-btn:hover {
            background-color: #A0522D;

        /* Стиль для кнопки копирования */

            font-weight: bold;
        }

        }
        /* Сообщение о копировании */

            color: #32CD32;
            font-weight: bold;
            margin-left: 10px;
            display: none;
        }
        
        /* Контейнер для кнопок */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

        function copyToClipboard() {
            const outputText = document.getElementById('output').textContent;
            
            if (!outputText || outputText.trim() === '') {
                alert('Сначала откройте текст для копирования!');
                return;
            }
            
            navigator.clipboard.writeText(outputText)
                .then(() => {
                    const message = document.getElementById('copyMessage');
                    message.style.display = 'inline';
                    
                    setTimeout(() => {
                        message.style.display = 'none';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Ошибка копирования: ', err);
                    
                    const textArea = document.createElement('textarea');
                    textArea.value = outputText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    const message = document.getElementById('copyMessage');
                    message.style.display = 'inline';
                    setTimeout(() => {
                        message.style.display = 'none';
                    }, 2000);
                });
        }
