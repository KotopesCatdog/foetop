        /* Контейнер для всего контента (кроме фиксированных кнопок) */

            color: #EFDBA6;

            border-radius: 8px;

        button:hover {
            background-color: #A0522D;
        }
        .output {
            margin-top: 20px;
            white-space: pre-wrap;
            border: 2px solid #EFDBA6;
            padding: 15px;
            background-color: white;
            color: black;
            border-radius: 8px;

            width: 90%;

            margin-left: auto;
            margin-right: auto;
        }
        .output:empty {
    display: none;
}
        p {
            font-size: 24px;
            font-weight: bold;
            text-align: center; /* Центрирование текста заголовка */
        }
        /* Кнопка "Назад" */
        .back-btn {

            top: 15px;
            left: 15px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            background-color: #8B4513;
            color: #EFDBA6;
            border: 2px solid #EFDBA6;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(239, 219, 166, 0.5);
            z-index: 100;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background-color: #A0522D;
            transform: scale(1.05);
        }
        /* Стиль для кнопки копирования */
        .copy-btn {
            background-color: #2E8B57;
            font-weight: bold;
        }
        .copy-btn:hover {
            background-color: #3CB371;
        }
        /* Сообщение о копировании */
        .copy-message {
            color: #32CD32;
            font-weight: bold;
            margin-left: 10px;
            display: none;
        }
        
        /* Контейнер для кнопок */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

        function copyToClipboard() {
            const outputText = document.getElementById('output').textContent;
            
            if (!outputText || outputText.trim() === '') {
                alert('Сначала откройте текст для копирования!');
                return;
            }
            
            navigator.clipboard.writeText(outputText)
                .then(() => {
                    const message = document.getElementById('copyMessage');
                    message.style.display = 'inline';
                    
                    setTimeout(() => {
                        message.style.display = 'none';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Ошибка копирования: ', err);
                    
                    const textArea = document.createElement('textarea');
                    textArea.value = outputText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    const message = document.getElementById('copyMessage');
                    message.style.display = 'inline';
                    setTimeout(() => {
                        message.style.display = 'none';
                    }, 2000);
                });
        }
